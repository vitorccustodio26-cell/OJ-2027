<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyOS · Oficial de Justiça TJSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* Aplica o tema antes de desenhar a página (evita "piscar" o tema errado) */
(function(){try{var t=localStorage.getItem('studyos-tema')||'auto';var d=t==='escuro'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.setAttribute('data-te',d?'dark':'light');r.setAttribute('data-tema',t)}catch(e){}})();
</script>
<style>
/* ===== Tokens de cor: tema claro ===== */
:root{
  color-scheme:light;
  --bg:#f5f6fa;--card:#fff;--field:#fff;--ink:#1c2230;--muted:#646c7e;--line:#e5e7ee;--soft:#f0f1f6;--hover:#eceef4;
  --accent:#4f46e5;--accent-bg:#4f46e5;--on-accent:#fff;--accent-soft:#eef0ff;
  --red:#e5484d;--danger-bg:#d1363b;--red-soft:#fdecec;--red-ink:#a31f26;
  --yellow:#e09b13;--yellow-soft:#fdf4e1;--yellow-ink:#7a5200;
  --green:#2f9e66;--green-soft:#e6f6ee;--green-ink:#1a6440;
  --blue-soft:#e6f0ff;--blue-ink:#22509f;--violet-soft:#ede7ff;--violet-ink:#5536c9;--orange-soft:#fde7d6;--orange-ink:#8f4410;
  --chip-bg:#111827;--chip-ink:#fff;--over:#e3e6ff;--off1:#f3f3f6;--off2:#ececf1;--wk-ink:#a9afbc;
  --cd-st:#eef0ff;--strike:#9aa0ad;--late-bg:#fffafa;--late-line:#f3b3b5;
  --chart-grid:#e5e7ee;--chart-70:#f3b3b5;--chart-80:#b6e3cb;--chart-bar:#c7cbe0;--chart-fin:#b9a8f5;--chart-meta:#c7cbe0;
  --heat0:#eceef6;--heat1:#d9d6fb;--heat2:#b0a9f6;--heat3:#7f75ee;--heat4:#4f46e5;--heat-off:#f6f6f8;
  --overlay:rgba(17,24,39,.42);--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);--shadow-lg:0 20px 50px rgba(0,0,0,.2);
  --r:12px;--ft:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
/* ===== Tokens de cor: tema escuro ===== */
:root[data-te=dark]{
  color-scheme:dark;
  --bg:#0f131a;--card:#171c26;--field:#1d2330;--ink:#e6e9f0;--muted:#9ba3b4;--line:#2a3141;--soft:#212836;--hover:#262e3d;
  --accent:#8f8aff;--accent-bg:#5a51e4;--on-accent:#fff;--accent-soft:#252a4b;
  --red:#ff6b6f;--danger-bg:#c4353a;--red-soft:#3a1f25;--red-ink:#ffaaad;
  --yellow:#f0b43c;--yellow-soft:#392f1c;--yellow-ink:#f6d07c;
  --green:#3fc283;--green-soft:#163428;--green-ink:#86e3b4;
  --blue-soft:#1c2943;--blue-ink:#a5c3ff;--violet-soft:#2a2546;--violet-ink:#c8b9ff;--orange-soft:#3b2a1d;--orange-ink:#f8b989;
  --chip-bg:#e6e9f0;--chip-ink:#111827;--over:#2d3260;--off1:#191e28;--off2:#1e2430;--wk-ink:#4f586a;
  --cd-st:#232a44;--strike:#6b7385;--late-bg:#24181c;--late-line:#6a2c33;
  --chart-grid:#2a3141;--chart-70:#7a3a40;--chart-80:#2d6a4b;--chart-bar:#3a4257;--chart-fin:#6c5dc6;--chart-meta:#3a4257;
  --heat0:#232a38;--heat1:#2f2c62;--heat2:#463f9c;--heat3:#635ad6;--heat4:#8f8aff;--heat-off:#161a22;
  --overlay:rgba(0,0,0,.62);--shadow:0 1px 2px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);--shadow-lg:0 20px 50px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45;overflow-x:clip}
h1,h2,h3,h4,.ft,button,.tag,.tab,.subtab,th,.kpi b,.badge,.chip{font-family:var(--ft)}
h2{font-size:20px;margin:0 0 4px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
h4{font-size:14px;margin:0 0 6px;font-weight:600}
code{background:var(--soft);padding:0 4px;border-radius:4px}
select,input,textarea{font-family:var(--fb);font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--field);min-width:0}
input::placeholder{color:var(--muted)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent-bg)}
button{font-size:13px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--hover)}
button.pri{background:var(--accent-bg);border-color:var(--accent-bg);color:var(--on-accent)}
button.pri:hover{filter:brightness(1.08);background:var(--accent-bg)}
button.dan{color:var(--red)}
button.sm{padding:3px 8px;font-size:12px}
button.ico{padding:3px 6px;border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1}
button.ico:hover{color:var(--ink);background:var(--hover)}
button:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.grid{display:grid;gap:14px}
.grid>*{min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.warn{background:var(--yellow-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--yellow-ink)}
.err{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--red-ink)}
.ok{background:var(--green-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--green-ink)}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px}
.tw{overflow-x:auto}

/* header */
header.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topin{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--ft);font-weight:700;font-size:20px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:6px;background:var(--accent-soft);border-radius:10px;padding:6px 12px}
.count b{font-family:var(--ft);font-size:22px;color:var(--accent)}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savest .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.savest.saving .dot{background:var(--yellow)}.savest.error .dot{background:var(--red)}.savest.error{color:var(--red)}
.temasel button{padding:5px 9px;font-size:12px}
.timerw{display:none;align-items:center;gap:6px;background:var(--chip-bg);color:var(--chip-ink);border-radius:10px;padding:5px 8px 5px 12px;font-size:12px}
.timerw.on{display:flex}
.timerw b{font-family:var(--ft);font-size:16px;font-variant-numeric:tabular-nums}
.timerw button{background:color-mix(in srgb,var(--chip-ink) 14%,transparent);border:none;color:var(--chip-ink);padding:3px 8px}
.timerw.brk{background:var(--green-ink);color:var(--card)}
.timerw.alert{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 40%,transparent)}}

/* calendar */
.calbar{max-width:1400px;margin:0 auto;padding:10px 16px 0}
.cal{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.calm{flex:0 1 420px;min-width:min(260px,100%)}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.calhead b{font-family:var(--ft);font-size:14px;min-width:130px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .dh{font-size:10px;color:var(--muted);text-align:center;font-family:var(--ft)}
.cd{font-size:11px;text-align:center;border-radius:6px;padding:3px 0;cursor:pointer;background:var(--soft);color:var(--ink);position:relative}
.cd.wk{background:transparent;color:var(--wk-ink);cursor:default}
.cd.fol{background:var(--orange-soft);color:var(--orange-ink)}
.cd.rv{background:var(--violet-soft);color:var(--violet-ink)}
.cd.st{background:var(--cd-st)}
.cd.prova{background:var(--danger-bg);color:#fff;font-weight:700}
.cd.today{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.cd.out{visibility:hidden}
.cd.done::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}
.cd.late::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
.calleg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.calside{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;align-content:start;min-width:min(220px,100%)}
.kpi{background:var(--soft);border-radius:10px;padding:8px 12px}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* tabs */
nav.tabs{max-width:1400px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:none;background:transparent;padding:9px 14px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px}
.tab.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
nav.bnav{display:none}
main{max-width:1400px;margin:0 auto;padding:14px 16px 60px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.subtab{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);flex:none}
.subtab.on{background:var(--ink);border-color:var(--ink);color:var(--card)}
.subtab.cur{border-color:var(--accent);color:var(--accent)}
.subtab.on.cur{color:var(--card)}
.subtab.fin{border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--card)}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:var(--card)}

/* tags (cor da matéria: --c, --tbg, --tfg gerados por tema com contraste AA) */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;line-height:1.5;white-space:nowrap}
.tag.tm{background:var(--tbg);color:var(--tfg)}
.tag.A{background:var(--red-soft);color:var(--red-ink)}.tag.M{background:var(--yellow-soft);color:var(--yellow-ink)}.tag.B{background:var(--blue-soft);color:var(--blue-ink)}
.tag.rev{background:var(--violet-soft);color:var(--violet-ink)}
.tag.late{background:var(--danger-bg);color:#fff}
.tag.fin{background:var(--violet-soft);color:var(--violet-ink)}
.tag.cust{background:var(--soft);color:var(--muted)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--soft);border-radius:var(--r);padding:8px;min-height:120px;transition:background .15s;min-width:0}
.col.over{background:var(--over)}
.col.off{background:repeating-linear-gradient(45deg,var(--off1),var(--off1) 8px,var(--off2) 8px,var(--off2) 16px)}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px;gap:6px}
.colh b{font-family:var(--ft);font-size:13px}
.colh .small{text-align:right}
.colh.today b{color:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 9px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab;touch-action:manipulation;-webkit-touch-callout:none}
.card.dragging{opacity:.4}
.card.isdone{opacity:.72}
.card.isdone .ttl{text-decoration:line-through;text-decoration-color:var(--strike)}
.card.islate{border-color:var(--late-line);border-left-color:var(--red);background:var(--late-bg)}
.card.isrev{border-left-style:dashed}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.card .ttl{font-size:12.5px;font-weight:500;margin-bottom:6px;word-break:break-word}
.card .ttl small{color:var(--muted);font-weight:400}
.card .ctl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card .ctl select{font-size:11.5px;padding:3px 5px;flex:1;min-width:84px}
.card .meta{display:flex;align-items:center;gap:2px;margin-top:6px;flex-wrap:wrap}
.card .meta .mins{font-size:11.5px;color:var(--muted);font-family:var(--ft);margin-right:auto}
.card.tact{box-shadow:0 0 0 2px var(--accent)}
.dragghost{position:fixed;z-index:300;pointer-events:none;opacity:.9;transform:rotate(2deg);box-shadow:var(--shadow-lg);width:240px}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px}
.kb{grid-template-columns:repeat(5,minmax(0,1fr))}
.kb4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kb4 .col{max-height:640px;overflow-y:auto}

/* blocks */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px;margin-bottom:12px}
.mini{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-child{border-bottom:none}
.mini .t{flex:1;min-width:0}
.mini .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;min-width:22px;text-align:center;background:var(--danger-bg);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-family:var(--ft);font-weight:600}
.pill.g{background:var(--accent-bg)}

/* matérias */
.mat{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-bottom:10px;overflow:hidden}
.math{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.math h3{margin:0;font-size:15px}
.matb{padding:0 14px 12px;display:none}
.mat.open .matb{display:block}
.topic{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.topic .tn{flex:1;min-width:min(200px,100%);font-size:13px}
.topic select{font-size:12px;padding:3px 6px}
.st{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--ft);font-weight:600}
.st.Iniciado{background:var(--blue-soft);color:var(--blue-ink)}.st.Revisar{background:var(--yellow-soft);color:var(--yellow-ink)}.st.Finalizado{background:var(--green-soft);color:var(--green-ink)}

/* ciclo */
.cyc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cycd{background:var(--soft);border-radius:var(--r);padding:10px;min-width:0}
.slot{display:flex;gap:4px;margin-bottom:6px}
.slot select{flex:1}
.slot input{width:62px}

/* modal */
.ov{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 14px;overflow-y:auto}
.modal{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:var(--shadow-lg)}
.modal.wide{max-width:820px}
.modal h3{font-size:18px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fm label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.fm label.full{grid-column:1/-1}
.mft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:var(--chip-bg);color:var(--chip-ink);padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);max-width:92vw}
.toast.e{background:var(--danger-bg);color:#fff}

/* questões */
.acc{font-family:var(--ft);font-weight:600;padding:2px 8px;border-radius:999px;font-size:12px;display:inline-block}
.acc.r{background:var(--red-soft);color:var(--red-ink)}.acc.y{background:var(--yellow-soft);color:var(--yellow-ink)}.acc.g{background:var(--green-soft);color:var(--green-ink)}
.focus{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-radius:var(--r);padding:14px 16px;font-family:var(--ft);font-size:16px}
.focus b{font-weight:700}
.rk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rk:hover{background:var(--hover)}
.rk .n{width:22px;font-family:var(--ft);color:var(--muted);text-align:center}
.rk .t{flex:1;min-width:0}
.weak{background:var(--red-soft)}
.bnr{max-width:1400px;margin:10px auto 0;padding:0 16px}
.bnr .row{margin-top:6px}
svg .cg{stroke:var(--chart-grid)}svg .c70{stroke:var(--chart-70)}svg .c80{stroke:var(--chart-80)}
svg .tx{fill:var(--muted)}svg .tk{fill:var(--ink)}
.fbar .fsearch{flex:1 1 220px;min-width:0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.chip.x{padding-right:8px}
.fpanel{display:flex;flex-direction:column;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.fgrp{display:flex;flex-direction:column;gap:5px}
.fcount{white-space:nowrap}
.bar.big{height:10px;position:relative;overflow:visible;margin:6px 0 3px}
.bar.big>i{border-radius:5px}.bar.big>i.mid{background:var(--yellow)}.bar.big>i.bad{background:var(--red)}.bar.big>i.ok{background:var(--green)}
.bar.big>u{position:absolute;top:-3px;width:2px;height:16px;background:var(--ink);opacity:.45;border-radius:1px}
.meta-l{margin-bottom:12px}
.ritmo{font-size:11px;font-family:var(--ft);font-weight:600;padding:1px 8px;border-radius:999px}
.ritmo.ok{background:var(--green-soft);color:var(--green-ink)}.ritmo.mid{background:var(--yellow-soft);color:var(--yellow-ink)}.ritmo.bad{background:var(--red-soft);color:var(--red-ink)}
svg .bm{fill:var(--chart-meta)}svg .br{fill:var(--accent)}svg .br.ok{fill:var(--green)}
i.lg{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 3px 0 6px;vertical-align:-1px}i.lg.bm{background:var(--chart-meta)}i.lg.br{background:var(--accent)}
.hmgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.hmgrid .dh{font-size:10px;color:var(--muted);text-align:center;font-family:var(--ft)}
.hm{font-size:11px;text-align:center;border-radius:6px;padding:7px 0;color:var(--ink);background:var(--heat0)}
i.hm{display:inline-block;width:12px;height:12px;padding:0;margin:0 2px;vertical-align:-2px;border-radius:3px}
.hm.l1{background:var(--heat1)}.hm.l2{background:var(--heat2)}.hm.l3{background:var(--heat3);color:#fff}.hm.l4{background:var(--heat4);color:#fff}
:root[data-te=dark] .hm.l4{color:#0f131a}

function isFolga(s){return state.folgas.some(f=>f.on&&f.data===s)}

function semanas(){
  const out=[];let mon=segundaDe(INICIO),n=1;
  while(mon<=REV_FIM){
    const dias=[0,1,2,3,4].map(i=>addDias(mon,i));
    const ini=maxS(dias[0],INICIO);
    out.push({n,mon,dias,ini,fim:dias[4],final:mon===REV_INI,label:'S'+n+' · '+fmtBR(ini)+'–'+fmtBR(dias[4])});
    mon=addDias(mon,7);n++;

}

}
/* Retorna null se pode, ou o motivo do bloqueio. opts: {ignorarCarga, permitirFinal} */
function motivoBloqueio(s,m,min,excluirId,opts={}){
  if(!s)return 'Data inválida';
  const w=dow(s);
  if(w===0||w===6)return 'Sábado e domingo não têm estudo';
  if(s<INICIO||s>REV_FIM)return 'Fora do período do cronograma';
  if(isFolga(s))return 'Dia de folga ('+nomeFolga(s)+')';
  if(isSemanaFinal(s)&&!opts.permitirFinal)return 'A semana final (08 a 12/03) é reservada à revisão geral';
  const {subs,carga}=infoDia(s,excluirId);
  if(!subs.has(m)&&subs.size>=state.config.maxDisc)return 'O dia já tem '+state.config.maxDisc+' disciplinas';
  if((m===LP&&subs.has(INF))||(m===INF&&subs.has(LP)))return 'Português e Informática nunca podem cair no mesmo dia';
  if(!opts.ignorarCarga&&carga+(+min||0)>state.config.cargaMax)return 'Carga diária passaria de '+fmtHM(state.config.cargaMax);
  return null;
}

function statusTopico(tid){

}
function parteDe(c){

  return 'parte '+(cs.findIndex(x=>x.id===c.id)+1)+'/'+cs.length;
}

/* ---------- Gerador / redistribuidor do planejamento ----------
   Mantém: histórico (antes de "de"), cartões com status, cartões fixados manualmente, revisões.
   Redistribui o restante de cada tópico, na ordem do edital, pelas sessões futuras do ciclo semanal,
   proporcionalmente à incidência (ALTA > MÉDIA > BAIXA) e ao tamanho do tópico. */
function pesoTopico(t){return (INC_PESO[t.inc]||2)*(t.tam||1)}
function replanejar(deParam){
  const de=deParam||maxS(INICIO,hoje());
  const manter=[];
  for(const c of state.cards){
    if(c.tipo==='rev'){manter.push(c);continue}
    if(c.tipo==='final'){if(isFolga(c.data)&&c.status!=='Finalizado')continue;manter.push(c);continue}
    if(!TOP[c.t])continue;                                   // tópico excluído
    if(isFolga(c.data)&&c.status!=='Finalizado')continue;   // nunca deixar atividade em folga
    if(c.data<de){manter.push(c);continue}
    if(c.status||c.fixo)manter.push(c);
  }
  state.cards=manter;
  // semana final de revisão geral
  for(let s=REV_INI;s<=REV_FIM;s=addDias(s,1)){
    if(!isDiaEstudo(s))continue;
    for(const sl of (CICLO_FINAL[dow(s)]||[])){
      if(!MAT[sl.m])continue;
      if(state.cards.some(c=>c.tipo==='final'&&c.data===s&&c.m===sl.m))continue;
      state.cards.push({id:uid('f'),tipo:'final',m:sl.m,t:null,data:s,min:sl.min,status:'',metodo:'',titulo:tituloFinal(sl.m)});
    }
  }
  // sessões por matéria
  const capTot={},sess={};
  for(const m of state.materias){capTot[m.id]=0;sess[m.id]=[]}
  for(let s=INICIO;s<=FIM_CONTEUDO;s=addDias(s,1)){
    if(!isDiaEstudo(s))continue;
    for(const sl of (state.ciclo[dow(s)]||[])){
      if(!MAT[sl.m]||!sl.min)continue;
      capTot[sl.m]+=+sl.min;
      if(s>=de)sess[sl.m].push({data:s,min:+sl.min});
    }
  }
  const novos=[];
  for(const m of state.materias){
    const tops=m.topicos.filter(t=>!t.fora);
    if(!tops.length||!sess[m.id].length)continue;
    const W=tops.reduce((a,t)=>a+pesoTopico(t),0);
    const lista=[];
    for(const t of tops){
      const st=statusTopico(t.id);
      if(st==='Finalizado')continue;
      const mant=cardsDoTopico(t.id).reduce((a,c)=>a+(+c.min||0),0);
      const need=capTot[m.id]*pesoTopico(t)/W;
      let rem=need-mant;
      if(mant>0&&rem<15)continue;      // já coberto pelo que foi mantido
      lista.push({id:t.id,rem:Math.max(rem,15)});
    }
    if(!lista.length)continue;
    const Cf=sess[m.id].reduce((a,x)=>a+x.min,0);
    const R=lista.reduce((a,x)=>a+x.rem,0);
    const f=Cf/R;lista.forEach(x=>x.rem*=f);
    let i=0;const pcs=[];
    for(const se of sess[m.id]){
      let left=se.min;const ini=pcs.length;
      while(left>=10&&i<lista.length){
        const t=lista[i];let take=Math.min(left,t.rem);
        if(t.rem-take<12)take=t.rem;
        pcs.push({t:t.id,data:se.data,min:take});
        t.rem-=take;left-=take;
        if(t.rem<=.5)i++;
      }
      if(left>0&&pcs.length>ini)pcs[pcs.length-1].min+=left;
    }
    while(i<lista.length){ // sobras de arredondamento vão para a última sessão
      const se=sess[m.id][sess[m.id].length-1];pcs.push({t:lista[i].id,data:se.data,min:Math.max(10,lista[i].rem)});i++;
    }
    // junta pedaços do mesmo tópico no mesmo dia e arredonda para 5 min
    const mg=[];
    for(const p of pcs){const l=mg[mg.length-1];if(l&&l.t===p.t&&l.data===p.data)l.min+=p.min;else mg.push({...p})}
    for(const p of mg)novos.push({id:uid('c'),tipo:'estudo',m:m.id,t:p.t,data:p.data,min:Math.max(10,Math.round(p.min/5)*5),status:'',metodo:''});
  }
  state.cards.push(...novos);
  // nunca ultrapassar a carga diária por arredondamento
  const dias=[...new Set(novos.map(c=>c.data))];
  for(const d of dias){
    let exc=infoDia(d).carga-state.config.cargaMax;
    while(exc>0){
      const alvo=novos.filter(c=>c.data===d&&c.min>10).sort((a,b)=>b.min-a.min)[0];if(!alvo)break;
      const r=Math.min(exc,alvo.min-10);alvo.min-=r;exc-=r;
    }
  }
  if(typeof reposicionarRevisoes==='function')reposicionarRevisoes(de);
}

function migrar(d){
  if(!d||typeof d!=='object')throw new Error('Arquivo inválido');
  if(d.versao==null)throw new Error('Campo "versao" ausente');
  if(d.versao>VERSAO_DADOS)throw new Error('Versão de dados mais nova que este StudyOS');
  if(d.versao===1){ // v1 -> v2: tema, filtros, metas e constância (nada da v1 é removido)
    d.prefs=Object.assign({tema:'auto'},d.prefs||{});
    d.filtros=d.filtros||null; // filtros, metas e constância recebem os padrões logo abaixo
    d.versao=2;
  }
  // futuras migrações: if(d.versao===2){...; d.versao=3}
  const base=estadoInicial();
  for(const k of Object.keys(base))if(d[k]===undefined)d[k]=base[k];
  d.config=Object.assign(base.config,d.config||{});
  d.prefs=Object.assign(base.prefs,d.prefs||{});
  if(!d.filtros||!d.filtros.atual)d.filtros=base.filtros;
  for(const k of Object.keys(base.filtros.atual))d.filtros.atual[k]=Object.assign(base.filtros.atual[k],d.filtros.atual[k]||{});
  if(!Array.isArray(d.filtros.salvos))d.filtros.salvos=[];
  d.metas=Object.assign(base.metas,d.metas||{});d.metas.historico=d.metas.historico||{};
  d.constancia=Object.assign(base.constancia,d.constancia||{});
  d.meta=Object.assign(base.meta,d.meta||{});
  return d;
}

/* Cores das matérias: mesma identidade nos dois temas, com contraste AA (4,5:1) no texto das tags */
function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16))}
function rgb2hex(c){return '#'+c.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join('')}
function mix(a,b,t){return a.map((v,i)=>v+(b[i]-v)*t)}
function lum(c){const f=v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)};return .2126*f(c[0])+.7152*f(c[1])+.0722*f(c[2])}
function contraste(a,b){const x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function ajustar(c,fundo,alvo,para){let t=0,r=c;while(contraste(r,fundo)<alvo&&t<1){t+=.04;r=mix(c,para,t)}return r}
function paletaMateria(cor){
  const c=hex2rgb(cor),W=[255,255,255],K=[0,0,0],cardL=[255,255,255],cardD=hex2rgb('#171c26');
  const tbgL=mix(cardL,c,.14),tfgL=ajustar(mix(c,K,.25),tbgL,4.6,K);
  const cD=ajustar(c,cardD,3.2,W),tbgD=mix(cardD,cD,.24),tfgD=ajustar(mix(cD,W,.35),tbgD,4.6,W);
  return {light:{c:cor,tbg:rgb2hex(tbgL),tfg:rgb2hex(tfgL)},dark:{c:rgb2hex(cD),tbg:rgb2hex(tbgD),tfg:rgb2hex(tfgD)}};
}
function gerarCoresMaterias(){

  el.textContent=':root{'+L+'}:root[data-te=dark]{'+D+'}';
}

   }).join('')+'</table></div></div>';

function validarCiclo(c){
  const erros=[],avisos=[];const sem=new Set();
  for(const d of [1,2,3,4,5]){
    const sl=(c[d]||[]).filter(x=>x.m);const set=new Set(sl.map(x=>x.m));
    set.forEach(m=>sem.add(m));
    if(set.size>state.config.maxDisc)erros.push(DIAS_L[d]+': mais de '+state.config.maxDisc+' disciplinas.');
    if(set.has(LP)&&set.has(INF))erros.push(DIAS_L[d]+': Língua Portuguesa e Informática não podem ficar no mesmo dia.');
    if(set.size<sl.length)avisos.push(DIAS_L[d]+': matéria repetida no mesmo dia (os blocos serão somados).');
    const tot=sl.reduce((a,x)=>a+(+x.min||0),0);
    if(tot>state.config.cargaMax)erros.push(DIAS_L[d]+': carga de '+fmtHM(tot)+' acima do máximo de '+fmtHM(state.config.cargaMax)+'.');
    else if(tot&&tot<180)avisos.push(DIAS_L[d]+': carga de '+fmtHM(tot)+' abaixo de 3h.');
  }
  const falt=state.materias.filter(m=>!sem.has(m.id)&&m.topicos.some(t=>!t.fora));
  if(falt.length)erros.push('Sem horário no ciclo (os tópicos não serão agendados): '+falt.map(m=>m.nome).join(', ')+'.');
  return {erros,avisos};
}

  for(const m of state.materias){
    const tops=m.topicos,tf=tops.filter(t=>statusTopico(t.id)==='Finalizado').length,pct=tops.length?Math.round(100*tf/tops.length):0;
    if(fm.mats.length&&!fm.mats.includes(m.id))continue;

    if(fa&&!visM.size)continue;
    const open=ui.matOpen[m.id]||fa;
    h+='<div class="mat'+(open?' open':'')+'"><div class="math" data-matopen="'+m.id+'"><span class="dotc" style="--c:'+cv(m.id)+'"></span><h3>'+esc(m.nome)+'</h3><span class="small muted">'+esc(m.pesoTxt)+'</span><span class="sp"></span>'+
      '<label class="small muted row" style="gap:4px" data-stop>Incidência <select data-matinc="'+m.id+'">'+optsInc(m.inc)+'</select></label>'+
      '<span class="small muted">'+tf+'/'+tops.length+'</span><div class="bar" style="width:80px"><i style="width:'+pct+'%;background:'+cv(m.id)+'"></i></div><span>'+(open?'▾':'▸')+'</span></div>';
    h+='<div class="matb">';
    tops.forEach((t,i)=>{
      if(visM&&!visM.has(t))return;
      const st=statusTopico(t.id),n=cardsDoTopico(t.id);
      const datas=n.length?n.map(c=>fmtBR(c.data)).join(', '):'não agendado';
      h+='<div class="topic"><span class="tiny muted" style="width:22px">'+(i+1)+'.</span><span class="tn">'+esc(t.nome)+(t.custom?' <span class="tag cust">novo</span>':'')+'<div class="tiny muted">📅 '+datas+'</div></span>'+
        '<span class="st '+(st||'')+'">'+(st||'Não iniciado')+'</span><select data-topinc="'+t.id+'" title="Incidência estimada">'+optsInc(t.inc)+'</select>'+

    });
    h+='<div class="topic"><button class="sm" data-act="topAdd" data-id="'+m.id+'">+ Adicionar tópico</button></div></div></div>';
  }
  return h;
};

const COLS_KB=[['','A fazer'],['Iniciado','Iniciado'],['Revisar','Revisar'],['Finalizado','Finalizado'],['rev','Revisões pendentes']];
function htmlKanban(w,cs){
  const ord=cs.slice().sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0);

    const its=ord.filter(c=>k==='rev'?(c.tipo==='rev'&&c.status!=='Revisada'):k==='Finalizado'?(c.status==='Finalizado'||c.status==='Revisada'):(c.tipo!=='rev'&&(c.status||'')===k));

function soltarKanban(id,st){

/* =================== ETAPA 3: revisões, atrasos, cronômetro, questões =================== */

/* ---------- Revisão espaçada automática (D+1, D+7, D+30) ---------- */
function aoMudarStatusTopico(tid,ant,nov){
  if(ant!=='Finalizado'&&nov==='Finalizado')agendarRevisoes(tid);
  else if(ant==='Finalizado'&&nov!=='Finalizado')removerRevisoes(tid);
}
function acharDiaRevisao(c,de){
  let d=maxS(maxS(c.alvo,INICIO),de||INICIO);
  while(d<=FIM_CONTEUDO){if(!motivoBloqueio(d,c.m,c.min,c.id))return d;d=addDias(d,1)}
  return null; // cairia na semana final ou depois de 12/03: descartada
}
function agendarRevisoes(tid){
  const base=hoje();state.finalizadoEm[tid]=base;const m=TOP[tid].m;
  removerRevisoes(tid,true);
  let ok=[],desc=0;
  for(const n of [1,7,30]){
    const c={id:uid('r'),tipo:'rev',m:m.id,t:tid,n,alvo:addDias(base,n),min:+state.config.revMin[n]||15,status:'Pendente',metodo:''};
    const d=acharDiaRevisao(c);
    if(d){c.data=d;state.cards.push(c);ok.push('D+'+n+' '+fmtBR(d))}else desc++;
  }
  toast('Revisões agendadas: '+(ok.join(', ')||'nenhuma')+(desc?' · '+desc+' descartada(s) (cairiam na semana final ou após 12/03)':''));
}
function removerRevisoes(tid,silencioso){
  const n=state.cards.filter(c=>c.tipo==='rev'&&c.t===tid).length;
  state.cards=state.cards.filter(c=>!(c.tipo==='rev'&&c.t===tid));
  if(!silencioso){delete state.finalizadoEm[tid];if(n)toast(n+' revisão(ões) agendada(s) removida(s)')}
}
function reposicionarRevisoes(de){
  const pend=state.cards.filter(c=>c.tipo==='rev'&&c.status!=='Revisada'&&(c.data>=de||isFolga(c.data)));
  state.cards=state.cards.filter(c=>!pend.includes(c));
  pend.sort((a,b)=>a.alvo<b.alvo?-1:1);
  for(const c of pend){const d=acharDiaRevisao(c,isFolga(c.data)?c.data:de);if(d){c.data=d;state.cards.push(c)}}
}

/* ---------- Blocos do topo: revisões de hoje e pendências ---------- */
const ORD_INC={A:0,M:1,B:2};
function incDe(c){return c.t&&TOP[c.t]?TOP[c.t].t.inc:'M'}
function htmlBlocosTopo(){
  const h=hoje();
  const revH=state.cards.filter(c=>c.tipo==='rev'&&c.data===h);
  const revV=state.cards.filter(c=>c.tipo==='rev'&&c.data<h&&c.status!=='Revisada');
  const atr=state.cards.filter(isAtrasado).sort((a,b)=>ORD_INC[incDe(a)]-ORD_INC[incDe(b)]||(a.data<b.data?-1:1));
  const lin=(c,extra)=>'<div class="mini"><input type="checkbox" data-revok="'+c.id+'"'+(c.status==='Revisada'?' checked':'')+' title="Marcar como revisada">'+

function proximosDiasLivres(c){ // sugestões rápidas: próximos 4 dias que aceitam o bloco sem estourar regras
  const out=[];let d=maxS(hoje(),INICIO);
  const lim=c.tipo==='final'?REV_FIM:FIM_CONTEUDO;
  for(;d<=lim&&out.length<4;d=addDias(d,1))if(d!==c.data&&!motivoBloqueio(d,c.m,c.min,c.id,{permitirFinal:c.tipo==='final'}))out.push(d);
  return out;
}
/* Simula a redistribuição dos atrasados: alta incidência primeiro; próximos dias úteis; respeita 3 disciplinas,
   carga diária e Português x Informática; pode dividir em blocos de 15 min ou mais; nunca entra na semana final. */
function simularAtrasados(){
  const orig=state.cards;state.cards=clone(orig);
  const late=state.cards.filter(isAtrasado).sort((a,b)=>ORD_INC[incDe(a)]-ORD_INC[incDe(b)]||(a.data<b.data?-1:1));
  const ini=maxS(hoje(),INICIO),res=[],semEnc=[];
  for(const L of late){
    const antes=L.data,minOrig=L.min;let rest=L.min;const pcs=[],criados=[];
    L.data='__x';                                     // tira do dia original durante a busca
    for(let d=ini;d<=FIM_CONTEUDO&&rest>0;d=addDias(d,1)){
      const pc=Math.min(rest,15);
      if(motivoBloqueio(d,L.m,pc,L.id))continue;
      const room=state.config.cargaMax-infoDia(d,L.id).carga;
      let take=Math.min(rest,room);
      if(take<rest&&rest-take<15)take=rest-15;          // evita sobrar pedaço menor que 15 min
      if(take<Math.min(15,rest))continue;
      const nc=pcs.length?{...L,id:uid('c'),data:d,min:take,fixo:true}:Object.assign(L,{data:d,min:take,fixo:true});
      if(pcs.length){state.cards.push(nc);criados.push(nc.id)}
      pcs.push({data:d,min:take});rest-=take;
    }
    if(rest>0){ // não coube inteiro: desfaz
      state.cards=state.cards.filter(c=>!criados.includes(c.id));
      L.data=antes;L.min=minOrig;semEnc.push(L);
    }else res.push({c:L,de:antes,pcs});
  }
  const sim=state.cards;state.cards=orig;
  return {sim,res,semEnc};
}
ACOES.replanAtr=()=>{
  const {sim,res,semEnc}=simularAtrasados();

}

      t.acum+=Date.now()-t.inicio;t.inicio=null;t.fase='pausa';t.pausaAte=Date.now()+state.config.pomoPausa*60000;
      bip();toast('🍅 Foco concluído! Pausa de '+state.config.pomoPausa+' min.');commit();return;

function optsTopicos(mid,sel){if(!mid||!MAT[mid])return '<option value="">—</option>';return '<option value="">Todos / não informado</option>'+MAT[mid].topicos.map(t=>'<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.nome.length>90?t.nome.slice(0,88)+'…':t.nome)+'</option>').join('')}
const accCls=p=>p<70?'r':p<=80?'y':'g';
const accTag=(ok,n)=>n?'<span class="acc '+accCls(100*ok/n)+'">'+Math.round(100*ok/n)+'%</span>':'<span class="muted">—</span>';
function statsQ(filtro){let n=0,ok=0;for(const q of state.questoes)if(filtro(q)){n+=q.total;ok+=q.ok}return {n,ok,p:n?100*ok/n:null}}
function prioridades(){
  const h=hoje(),maxP=Math.max(...state.materias.map(m=>m.pesoPrio||m.questoes||1));
  return state.materias.map(m=>{
    let N=0,E=0,n=0,ok=0;
    for(const q of state.questoes)if(q.m===m.id){const w=difDias(q.data,h)<=30?2:1;N+=w*q.total;E+=w*q.err;n+=q.total;ok+=q.ok}
    const err=(E+.3*10)/(N+10);                         // suavizado: sem dados assume 30% de erro
    const pn=(m.pesoPrio||m.questoes||1)/maxP,inf=INC_FATOR[m.inc]||.66;
    const idx=Math.round(100*(.5*err+.3*pn+.2*inf));
    const partes=[pn>=.55?'Peso alto no edital':pn>=.3?'Peso médio no edital':'Peso baixo no edital'];
    if(m.inc==='A')partes.push('incidência ALTA');else if(m.inc==='B')partes.push('incidência BAIXA');
    partes.push(n?Math.round(100*ok/n)+'% de acertos'+(n<state.config.amostraMin?' (amostra pequena)':''):'sem questões registradas');
    return {m,idx,just:partes.join(' + '),n};
  }).sort((a,b)=>b.idx-a.idx);
}

  return o;
};

document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches('[data-qf]'))return;
  t.dataset.auto='';
  const f={tot:$('#qTot'),ok:$('#qOk'),err:$('#qErr')};
  const v=k=>f[k].value===''?null:+f[k].value;
  const auto=Object.keys(f).find(k=>f[k].dataset.auto==='1');
  const vazios=Object.keys(f).filter(k=>v(k)===null);
  const alvo=auto||(vazios.length===1?vazios[0]:null);
  if(alvo&&f[alvo]!==t){
    const o=Object.keys(f).filter(k=>k!==alvo);
    if(o.every(k=>v(k)!==null)){
      const r=alvo==='tot'?v('ok')+v('err'):alvo==='ok'?v('tot')-v('err'):v('tot')-v('ok');
      f[alvo].value=r;f[alvo].dataset.auto='1';
    }
  }
  const T=v('tot'),O=v('ok');$('#qPrev').innerHTML=T&&O!=null&&O<=T?accTag(O,T):'';
});
ACOES.qSalvar=()=>{
  const data=$('#qData').value,m=$('#qMat').value,t=$('#qTop').value||null;
  const tot=$('#qTot').value===''?null:+$('#qTot').value,ok=$('#qOk').value===''?null:+$('#qOk').value,er=$('#qErr').value===''?null:+$('#qErr').value;
  const msg=[];
  if(!data)msg.push('Informe a data.');if(!m)msg.push('Escolha a matéria.');
  if(tot==null||ok==null||er==null)msg.push('Preencha ao menos dois dos campos total, acertos e erros.');
  else{
    if([tot,ok,er].some(x=>x<0||!Number.isInteger(x)))msg.push('Use números inteiros não negativos.');
    if(tot===0)msg.push('O total precisa ser maior que zero.');

  }

/* =================== ETAPA 4: backup e persistência =================== */
/* Camada de dados: carregarDados() · salvarDados() · exportarDados() · importarDados()
   - localStorage a cada alteração (1 s de espera para agrupar);
   - Chrome/Edge: pasta escolhida pelo usuário (File System Access API) com studyos-dados.json
     e cópia diária studyos-backup-AAAA-MM-DD.json (mantém as 14 mais recentes);
   - cópias diárias também no localStorage (14), para "Restaurar versão anterior". */
const FS_OK=typeof window.showDirectoryPicker==='function';
const LS_COPIAS='studyos-copias';
let pasta=null,pastaOk=false,filaGravacao=Promise.resolve();

function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('studyos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){try{const db=await idb();return await new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}catch(e){return null}}
async function idbSet(k,v){try{const db=await idb();await new Promise(r=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=r;tx.onerror=r})}catch(e){}}

function lerCopias(){try{return JSON.parse(localStorage.getItem(LS_COPIAS)||'{}')}catch(e){return {}}}
function copiaDiariaLocal(json){
  const d=d2s(new Date()),c=lerCopias();c[d]=json;
  const ks=Object.keys(c).sort().reverse();ks.slice(14).forEach(k=>delete c[k]);
  try{localStorage.setItem(LS_COPIAS,JSON.stringify(c))}catch(e){ // sem espaço: mantém menos cópias
    try{ks.slice(5).forEach(k=>delete c[k]);localStorage.setItem(LS_COPIAS,JSON.stringify(c))}catch(_){}
  }
}
/* substitui o salvarDados da etapa 1 */
salvarDados=function(){
  clearTimeout(saveTimer);saveTimer=null;
  state.atualizadoEm=new Date().toISOString();
  let json;
  try{json=JSON.stringify(state);localStorage.setItem(LS_KEY,json);copiaDiariaLocal(json)}
  catch(e){console.error(e);setSaveSt('error');return}
  if(pasta&&pastaOk){setSaveSt('saving');filaGravacao=filaGravacao.then(()=>gravarPasta(json)).then(()=>setSaveSt('ok')).catch(e=>{console.error(e);setSaveSt('error');pastaOk=false;renderBanners()})}
  else setSaveSt('ok');
};
async function gravarArq(nome,txt){const fh=await pasta.getFileHandle(nome,{create:true});const w=await fh.createWritable();await w.write(txt);await w.close()}
async function gravarPasta(json){
  await gravarArq('studyos-dados.json',json);
  const d=d2s(new Date());
  await gravarArq('studyos-backup-'+d+'.json',json);      // cópia do dia (sobrescreve no mesmo dia)
  const bks=[];for await(const [n,h] of pasta.entries())if(h.kind==='file'&&/^studyos-backup-\d{4}-\d{2}-\d{2}\.json$/.test(n))bks.push(n);
  bks.sort().reverse().slice(14).forEach(n=>pasta.removeEntry(n).catch(()=>{}));
  if(state.meta.ultimoBackupExterno!==new Date().toISOString().slice(0,10)){state.meta.ultimoBackupExterno=new Date().toISOString().slice(0,10);try{localStorage.setItem(LS_KEY,JSON.stringify(state))}catch(e){}}
}
async function escolherPasta(){
  if(!FS_OK){toast('Este navegador não permite escolher pasta. Use Exportar backup.',1);return}
  try{
    const h=await window.showDirectoryPicker({id:'studyos',mode:'readwrite'});
    pasta=h;pastaOk=true;await idbSet('pasta',h);state.meta.pastaRecusada=false;
    // se já houver dados na pasta e forem mais novos, oferece carregar
    try{const fh=await h.getFileHandle('studyos-dados.json');const d=JSON.parse(await (await fh.getFile()).text());
      if(d&&d.atualizadoEm&&state.atualizadoEm&&d.atualizadoEm>state.atualizadoEm){fecharModal();confirmar('A pasta já tem um <b>studyos-dados.json</b> mais recente ('+new Date(d.atualizadoEm).toLocaleString('pt-BR')+'). Carregar esses dados no lugar dos atuais?',()=>aplicarDados(d,'Dados da pasta carregados'),'Carregar',false)}
    }catch(_){}
    fecharModal();salvarDados();render();toast('Pasta conectada: '+h.name);
  }catch(e){if(e.name!=='AbortError')toast('Não foi possível usar a pasta: '+e.message,1)}
}
async function reconectarPasta(){
  if(!pasta)return escolherPasta();
  try{const p=await pasta.requestPermission({mode:'readwrite'});pastaOk=p==='granted';if(pastaOk){salvarDados();toast('Pasta reconectada')}render()}catch(e){toast('Falha ao reconectar: '+e.message,1)}
}
function exportarDados(){
  const json=JSON.stringify(state,null,2),d=d2s(new Date());
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download='studyos-backup-'+d+'.json';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  state.meta.ultimoBackupExterno=d;salvarDados();render();toast('Backup exportado');
}
function validarDados(d){
  d=migrar(d);
  if(!Array.isArray(d.materias)||!d.materias.length||!Array.isArray(d.cards))throw new Error('Estrutura inválida (faltam matérias ou planejamento)');
  if(d.cards.some(c=>!c||!c.id||!c.data||!c.m))throw new Error('Planejamento com blocos inválidos');
  return d;
}
function resumoDados(d){return '<ul class="small"><li>Salvo em: '+(d.atualizadoEm?new Date(d.atualizadoEm).toLocaleString('pt-BR'):'—')+'</li><li>Versão dos dados: '+d.versao+'</li><li>'+d.cards.length+' blocos · '+d.cards.filter(c=>c.status==='Finalizado').length+' finalizados</li><li>'+(d.questoes||[]).length+' registros de questões · '+(d.tempos||[]).length+' lançamentos de tempo</li></ul>'}
function aplicarDados(d,msg){state=d;indexar();aplicarTema();salvarDados();ui.semana=null;render();toast(msg||'Dados restaurados')}
function importarDados(arquivo){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=validarDados(JSON.parse(r.result))}catch(e){toast('Arquivo inválido: '+e.message,1);return}
    confirmar('Importar <b>'+esc(arquivo.name)+'</b>? Os dados atuais serão <b>sobrescritos</b>.'+resumoDados(d),()=>aplicarDados(d,'Backup importado'),'Sobrescrever');
  };
  r.onerror=()=>toast('Não foi possível ler o arquivo',1);
  r.readAsText(arquivo);
}
ACOES.bkExport=()=>exportarDados();
ACOES.bkImport=()=>{const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>i.files[0]&&importarDados(i.files[0]);i.click()};
ACOES.bkPasta=()=>escolherPasta();
ACOES.bkReconectar=()=>reconectarPasta();
ACOES.bkAgoraNao=()=>{state.meta.pastaRecusada=true;fecharModal();salvarDados();render()};
ACOES.bkRestaurar=async()=>{
  const itens=[];const c=lerCopias();
  for(const k of Object.keys(c).sort().reverse())itens.push({orig:'navegador',nome:'Cópia automática de '+fmtBR(k,1),get:()=>JSON.parse(c[k])});
  if(pasta&&pastaOk){try{const ns=[];for await(const [n,h] of pasta.entries())if(h.kind==='file'&&/^studyos-backup-.*\.json$/.test(n))ns.push([n,h]);
    ns.sort((a,b)=>a[0]<b[0]?1:-1).forEach(([n,h])=>itens.push({orig:'pasta',nome:n,get:async()=>JSON.parse(await (await h.getFile()).text())}))}catch(e){}}
  ACOES._rest=itens;
  modal('<h3>Restaurar versão anterior</h3><p class="small muted">Backups automáticos (mantidas as 14 cópias diárias mais recentes).</p>'+(itens.length?'<div class="tw"><table>'+itens.map((x,i)=>'<tr><td>'+esc(x.nome)+'</td><td class="small muted">'+(x.orig==='pasta'?'📁 pasta':'🌐 navegador')+'</td><td><button class="sm" data-act="bkRest1" data-id="'+i+'">Restaurar</button></td></tr>').join('')+'</table></div>':'<div class="empty">Nenhum backup automático ainda.</div>')+'<div class="mft"><button onclick="fecharModal()">Fechar</button></div>');
};
ACOES.bkRest1=async i=>{
  const it=ACOES._rest[+i];let d;
  try{d=validarDados(await it.get())}catch(e){toast('Backup inválido: '+e.message,1);return}
  confirmar('Restaurar “'+esc(it.nome)+'”? Os dados atuais serão substituídos.'+resumoDados(d),()=>aplicarDados(d,'Versão anterior restaurada'),'Restaurar');
};
function diasSemBackup(){const u=state.meta.ultimoBackupExterno;return u?difDias(u.slice(0,10),d2s(new Date())):null}
function renderBanners(){
  const el=$('#banners');if(!el||!state)return;let h='';
  const ds0=diasSemBackup();
  if(!FS_OK)h+='<div class="warn">⚠ <span>Este navegador não grava em pasta: os dados ficam só no navegador. <b>Exporte um backup toda semana</b>'+(ds0===null?' (nenhum backup externo ainda)':ds0>7?' (último há '+ds0+' dias)':'')+'.</span><span class="sp"></span><button class="sm" data-act="bkExport">Exportar backup</button></div>';
  else if(pasta&&!pastaOk)h+='<div class="warn">📁 A pasta de dados precisa ser reconectada (o navegador pede permissão a cada abertura). <span class="sp"></span><button class="sm pri" data-act="bkReconectar">Reconectar pasta</button></div>';
  else if(!pasta&&state.meta.pastaRecusada)h+='<div class="warn">Os dados estão só no navegador. Escolha uma pasta para salvar automaticamente o arquivo studyos-dados.json. <span class="sp"></span><button class="sm" data-act="bkPasta">Escolher pasta</button></div>';
  const ds=diasSemBackup();
  if(FS_OK&&!(pasta&&pastaOk)&&(ds===null||ds>7))h+='<div class="err" style="margin-top:6px">'+(ds===null?'Você ainda não fez nenhum backup externo.':'Mais de 7 dias sem backup externo ('+ds+' dias).')+' <span class="sp"></span><button class="sm" data-act="bkExport">Exportar backup</button></div>';
  el.innerHTML=h?'<div style="display:block">'+h.replace(/<div class="(warn|err)"/g,'<div class="$1 row"')+'</div>':'';
}
function htmlBackup(){
  const ds=diasSemBackup(),cop=Object.keys(lerCopias()).length;
  return '<div class="panel" style="margin-top:14px"><h3>Backup e persistência</h3>'+
   '<div class="grid g2"><div class="small">'+
   '<p>📦 Todos os dados (planejamento, status, tempo, questões, revisões e configurações) ficam em um único JSON com o campo <code>"versao": '+state.versao+'</code>.</p>'+

   '<p>🕒 Último backup externo: '+(state.meta.ultimoBackupExterno?fmtBR(state.meta.ultimoBackupExterno.slice(0,10),1)+(ds!=null?' ('+ds+' dia(s))':''):'nunca')+'</p></div>'+
   '<div><div class="row" style="margin-bottom:8px"><button class="pri" data-act="bkExport">⬇ Exportar backup</button><button data-act="bkImport">⬆ Importar backup</button><button data-act="bkRestaurar">↺ Restaurar versão anterior</button></div>'+

   '<p class="tiny muted">Dica: escolha uma pasta sincronizada (Google Drive, OneDrive, Dropbox) para ter cópia na nuvem sem plataformas pagas.</p></div></div></div>';

async function aoIniciar(){
  window.addEventListener('beforeunload',()=>{if(saveTimer)salvarDados()});
  document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveTimer)salvarDados()});

  }
}


/*@@V2_MODULOS@@*/
/* =================== v2 · ETAPA 3: metas e constância =================== */
/* Fonte única dos números: Tempo de Estudos (manual + cronômetro), Questões e tópicos finalizados. */
function minutosDia(d){let m=0;for(const t of state.tempos)if(t.data===d)m+=t.min;return m}
function questoesDia(d){let n=0;for(const q of state.questoes)if(q.data===d)n+=q.total;return n}
function topicosFinalizadosEm(de,ate){let n=0;for(const [tid,d] of Object.entries(state.finalizadoEm||{}))if(d>=de&&d<=ate&&TOP[tid]&&statusTopico(tid)==='Finalizado')n++;return n}
function soma(lista,de,ate,campo){let n=0;for(const x of lista)if(x.data>=de&&x.data<=ate)n+=x[campo];return n}
function semanaAtual(){const ws=semanas();return ws[semanaAtualIdx()]}
function diasUteis(w){return w.dias.filter(isDiaEstudo)}
function topicosPrevistos(w){ // tópicos cujo último bloco de estudo cai na semana
  const ult={};for(const c of state.cards)if(c.tipo==='estudo'&&c.t&&(!ult[c.t]||c.data>ult[c.t]))ult[c.t]=c.data;
  return Object.values(ult).filter(d=>d>=w.mon&&d<=w.fim).length;
}
function metaSemana(w){
  const n=diasUteis(w).length,M=state.metas,fr=n/5;
  const snap=M.historico&&M.historico[w.mon];
  if(snap&&w.fim<hoje())return Object.assign({dias:n},snap);
  return {dias:n,horas:Math.round(M.horas*fr),questoes:Math.round(M.questoes*fr),topicos:M.topicos==null?topicosPrevistos(w):Math.round(M.topicos*fr)};
}
function realizadoSemana(w){return {horas:soma(state.tempos,w.mon,w.fim,'min'),questoes:soma(state.questoes,w.mon,w.fim,'total'),topicos:topicosFinalizadosEm(w.mon,w.fim)}}

  const dias=[];for(let d=INICIO;d<=h&&d<=REV_FIM;d=addDias(d,1))if(isDiaEstudo(d))dias.push(d);
  for(const d of dias){if(diaEstudado(d)){run++;maior=Math.max(maior,run)}else if(d!==h)run=0}
  for(let i=dias.length-1;i>=0;i--){const d=dias[i];if(diaEstudado(d))atual++;else if(d===h)continue;else break}
  return {atual,maior:Math.max(maior,state.constancia&&state.constancia.maior||0)};
}

function statusCasa(c,s){

  if(f.status.length&&!f.status.some(s=>statusCasa(c,s)))return false;
  if(f.inc.length&&!(c.t&&TOP[c.t]&&f.inc.includes(TOP[c.t].t.inc)))return false;

ACOES.fGerir=()=>{
  const sv=state.filtros.salvos;
  const ov=modal('<h3>Filtros salvos</h3>'+(sv.length?'<div class="tw"><table><tr><th>Nome</th><th></th></tr>'+sv.map(x=>'<tr><td><input data-fsren="'+x.id+'" value="'+esc_(x.nome)+'" style="width:100%" aria-label="Nome do filtro"></td><td style="white-space:nowrap;text-align:right"><button class="sm" data-act="fAplicar" data-id="'+x.id+'">Aplicar</button><button class="ico" data-act="fDel" data-id="'+x.id+'" title="Excluir">🗑</button></td></tr>').join('')+'</table></div>':'<div class="empty">Nenhum filtro salvo.</div>')+'<div class="mft"><button class="pri" data-x>Concluir</button></div>');
  $('[data-x]',ov).onclick=()=>{$$('[data-fsren]',ov).forEach(i=>{const x=sv.find(s=>s.id===i.dataset.fsren);if(x&&i.value.trim())x.nome=i.value.trim()});fecharModal();filtrosMudaram()};
};
ACOES.fAplicar=id=>{const x=state.filtros.salvos.find(s=>s.id===id);if(!x)return;state.filtros.atual.plan=Object.assign(clone(FILTRO_VAZIO.plan),clone(x.f));fecharModal();filtrosMudaram();toast('Filtro “'+x.nome+'” aplicado')};
ACOES.fDel=id=>{const x=state.filtros.salvos.find(s=>s.id===id);fecharModal();confirmar('Excluir o filtro salvo “'+esc_(x?x.nome:'')+'”?',()=>{state.filtros.salvos=state.filtros.salvos.filter(s=>s.id!==id);filtrosMudaram()},'Excluir')};
let fqTimer=null;
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||!t.dataset.fq)return;
  F(t.dataset.fq).q=t.value;clearTimeout(fqTimer);fqTimer=setTimeout(()=>{agendarSalvar();render()},120);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.fsalvo!==undefined){if(t.value)ACOES.fAplicar(t.value);return}
  if(t.dataset&&t.dataset.fdate){F('plan')[t.dataset.fdate]=t.value;filtrosMudaram();return}
});

/* ---------- Ações (delegação de eventos) ---------- */
function cardPorId(id){return state.cards.find(c=>c.id===id)}
function definirStatus(c,st){
  if(c.tipo==='rev'){c.status=st;return}
  const ant=c.t?statusTopico(c.t):'';
  c.status=st;
  if(c.tipo==='estudo'&&c.t){
    const nov=statusTopico(c.t);
    if(typeof aoMudarStatusTopico==='function')aoMudarStatusTopico(c.t,ant,nov);
  }
}
ACOES.edit=id=>{
  const c=cardPorId(id);if(!c)return;const tp=c.t&&TOP[c.t]?TOP[c.t].t:null;
  const ov=modal('<h3>Editar bloco</h3><div>'+tagMat(c.m)+' '+(tp?tagInc(tp.inc):'')+'</div><div class="fm">'+
    '<label class="full">Título exibido<input id="eTit" value="'+esc(c.titulo||(tp?tp.nome:''))+'"></label>'+
    '<label>Data<input type="date" id="eData" value="'+c.data+'" min="'+INICIO+'" max="'+REV_FIM+'"></label>'+
    '<label>Duração (h:mm)<input id="eMin" value="'+fmtHM(c.min).replace('h','')+'"></label>'+
    '<label>Como concluir<select id="eMet"><option value="">—</option>'+METODOS.map(s=>'<option'+(c.metodo===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'+
    (tp?'<label>Incidência do tópico<select id="eInc">'+optsInc(tp.inc)+'</select></label>':'<span></span>')+
    '<label class="full">Anotação<input id="eNota" value="'+esc(c.nota||'')+'"></label></div>'+
    '<div id="eErr"></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Salvar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{
    const data=$('#eData').value,min=parseHM($('#eMin').value);
    if(min==null||min<5){$('#eErr').innerHTML='<div class="err">Duração inválida. Use o formato 01:30.</div>';return}
    if(data!==c.data||min!==c.min){
      const mot=motivoBloqueio(data,c.m,min,c.id,{permitirFinal:c.tipo==='final'||(c.data>=REV_INI)});
      if(mot&&!(mot.startsWith('Carga')&&data===c.data)){
        if(mot.startsWith('Carga')){if(!confirm(mot+'. Salvar mesmo assim?'))return}
        else{$('#eErr').innerHTML='<div class="err">'+mot+'.</div>';return}
      }
    }
    const tit=$('#eTit').value.trim();
    c.titulo=(tp&&tit===tp.nome)||!tit?undefined:tit;
    if(data!==c.data)c.fixo=true;
    c.data=data;c.min=min;c.metodo=$('#eMet').value;c.nota=$('#eNota').value.trim()||undefined;
    if(tp&&$('#eInc'))tp.inc=$('#eInc').value;
    if(c.tipo==='estudo')c.fixo=true;
    fecharModal();commit();
  };
};
ACOES.del=id=>{
  const c=cardPorId(id);if(!c)return;
  confirmar('Excluir este bloco do planejamento?<br><span class="small muted">'+esc(c.titulo||(c.t&&TOP[c.t]?TOP[c.t].t.nome:''))+'</span>',()=>{
    const ant=c.t?statusTopico(c.t):'';
    state.cards=state.cards.filter(x=>x.id!==id);
    if(c.tipo==='estudo'&&c.t&&typeof aoMudarStatusTopico==='function')aoMudarStatusTopico(c.t,ant,statusTopico(c.t));
    commit();toast('Bloco excluído');
  },'Excluir');
};
ACOES.calTgl=()=>{ui.calFechado=!ui.calFechado;renderCalendario()};
ACOES.cicloPadrao=()=>{state.ciclo=clone(CICLO_PADRAO);commit()};
ACOES.cicloAplicar=()=>{
  const v=validarCiclo(state.ciclo);if(v.erros.length){toast('Corrija os erros do ciclo antes de aplicar',1);return}
  confirmar('Redistribuir o planejamento futuro com este ciclo? O que já tem status, foi movido manualmente ou está no passado é mantido.',()=>{replanejar();commit();toast('Planejamento redistribuído')},'Redistribuir',false);
};
ACOES.replanTudo=()=>confirmar('Redistribuir o planejamento futuro (a partir de hoje)?',()=>{replanejar();commit();toast('Planejamento redistribuído')},'Redistribuir',false);
ACOES.topEdit=id=>{
  const {t}=TOP[id];
  const ov=modal('<h3>Editar tópico</h3><div class="fm"><label class="full">Nome<input id="tNome" value="'+esc(t.nome)+'"></label></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Salvar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{const v=$('#tNome').value.trim();if(v)t.nome=v;fecharModal();commit()};
};
ACOES.topDel=id=>{
  const {t,m}=TOP[id];
  confirmar('Excluir o tópico “'+esc(t.nome)+'” e todos os seus blocos e revisões?',()=>{
    m.topicos=m.topicos.filter(x=>x.id!==id);state.cards=state.cards.filter(c=>c.t!==id);delete state.finalizadoEm[id];commit();toast('Tópico excluído');
  },'Excluir');
};
ACOES.topAdd=mid=>{
  const m=MAT[mid];
  const ov=modal('<h3>Novo tópico · '+esc(m.nome)+'</h3><div class="fm"><label class="full">Nome do tópico<input id="nNome" placeholder="Ex.: Súmulas do STJ sobre citação"></label>'+
   '<label>Incidência estimada<select id="nInc">'+optsInc('M')+'</select></label>'+
   '<label>Como inserir<select id="nModo"><option value="redist">Redistribuir no planejamento futuro</option><option value="data">Agendar em uma data</option><option value="nao">Só cadastrar (sem agendar)</option></select></label>'+
   '<label>Data (se agendar)<input type="date" id="nData" min="'+INICIO+'" max="'+FIM_CONTEUDO+'"></label>'+
   '<label>Duração (h:mm)<input id="nMin" value="00:40"></label></div><div id="nErr"></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Adicionar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{
    const nome=$('#nNome').value.trim();if(!nome){$('#nErr').innerHTML='<div class="err">Informe o nome.</div>';return}
    const modo=$('#nModo').value,t={id:mid+'-n'+Date.now().toString(36),nome,inc:$('#nInc').value,tam:1,custom:true};
    if(modo==='data'){
      const d=$('#nData').value,min=parseHM($('#nMin').value);
      if(min==null||min<5){$('#nErr').innerHTML='<div class="err">Duração inválida.</div>';return}
      const mot=motivoBloqueio(d,mid,min,null);
      if(mot&&!mot.startsWith('Carga')){$('#nErr').innerHTML='<div class="err">'+mot+'.</div>';return}
      if(mot&&!confirm(mot+'. Agendar mesmo assim?'))return;
      t.fora=true;m.topicos.push(t);indexar();
      state.cards.push({id:uid('c'),tipo:'estudo',m:mid,t:t.id,data:d,min,status:'',metodo:'',fixo:true});
    }else if(modo==='nao'){t.fora=true;m.topicos.push(t);indexar()}
    else{m.topicos.push(t);indexar();replanejar()}
    fecharModal();ui.matOpen[mid]=true;commit();toast('Tópico adicionado');
  };
};
ACOES.folgaAdd=()=>{
  const d=$('#fData').value;if(!d){toast('Escolha a data',1);return}
  const w=dow(d);if(w===0||w===6){toast('Fins de semana já não têm estudo',1);return}
  if(state.folgas.some(f=>f.data===d)){toast('Essa data já está na lista',1);return}
  state.folgas.push({data:d,nome:$('#fNome').value.trim()||'Folga',on:true});replanejar();commit();toast('Folga adicionada e planejamento redistribuído');
};
ACOES.folgaDel=d=>confirmar('Remover a folga de '+fmtBR(d,1)+' da lista?',()=>{state.folgas=state.folgas.filter(f=>f.data!==d);replanejar();commit()},'Remover');
ACOES.cfSalvar=()=>{
  const c=parseHM($('#cfCarga').value);if(c==null||c<60||c>600){toast('Carga máxima inválida',1);return}
  state.config.cargaMax=c;state.config.amostraMin=Math.max(1,+$('#cfAmostra').value||20);
  state.config.revMin={1:+$('#cfR1').value||15,7:+$('#cfR7').value||15,30:+$('#cfR30').value||20};
  commit();toast('Preferências salvas');
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sem],[data-vista],[data-act],[data-calnav],[data-calday],[data-matopen]');
  if(!t)return;
  if(e.target.closest('[data-stop]'))return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;if(t.dataset.sem!=null)ui.semana=+t.dataset.sem;render();window.scrollTo(0,0);return}
  if(t.dataset.sem!=null){ui.semana=+t.dataset.sem;render();return}
  if(t.dataset.vista){ui.vista=t.dataset.vista;render();return}
  if(t.dataset.calnav!=null){
    const v=+t.dataset.calnav;
    if(v===0)ui.calMes=null;else{const[y,m]=ui.calMes.split('-').map(Number);const d=new Date(y,m-1+v,1);ui.calMes=d.getFullYear()+'-'+pad(d.getMonth()+1)}
    renderCalendario();return}
  if(t.dataset.calday){const w=semanaDe(t.dataset.calday);if(w){ui.tab='plan';ui.semana=w.n-1;render();window.scrollTo(0,0)}return}
  if(t.dataset.matopen){ui.matOpen[t.dataset.matopen]=!ui.matOpen[t.dataset.matopen];render();return}
  const a=t.dataset.act;if(a&&ACOES[a]){e.preventDefault();ACOES[a](t.dataset.id,t)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='status'){const c=cardPorId(t.dataset.id);if(c){definirStatus(c,t.value);commit()}return}
  if(t.dataset.act==='metodo'){const c=cardPorId(t.dataset.id);if(c){c.metodo=t.value;commit()}return}
  if(t.dataset.matinc){MAT[t.dataset.matinc].inc=t.value;commit();return}
  if(t.dataset.topinc){TOP[t.dataset.topinc].t.inc=t.value;commit();toast('Incidência atualizada (use “Redistribuir” para refletir no tempo dos blocos futuros)');return}
  if(t.dataset.folga){const f=state.folgas.find(x=>x.data===t.dataset.folga);f.on=t.checked;replanejar();commit();toast(f.on?'Folga ativada · planejamento redistribuído':'Folga desativada · planejamento redistribuído');return}
  if(t.dataset.cic){
    const d=t.dataset.cic,i=+t.dataset.i;const sl=state.ciclo[d]=state.ciclo[d]||[];
    while(sl.length<=i)sl.push({m:'',min:0});
    if(t.dataset.f==='m')sl[i].m=t.value;else sl[i].min=+t.value||0;
    state.ciclo[d]=sl.filter((x,j)=>x.m||j<sl.length);
    state.ciclo[d]=state.ciclo[d].filter(x=>x.m||x.min);
    commit();return}
  if(typeof aoChange==='function')aoChange(e);
});

/* ---------- Arrastar e soltar ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card],[data-tcard]');if(!c)return;dragId=c.dataset.card||('T:'+c.dataset.tcard);c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',e=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.over').forEach(x=>x.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-dropday],[data-dropst],[data-droptst]');if(!z||!dragId)return;e.preventDefault();$$('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-dropday],[data-dropst],[data-droptst]');if(!z||!dragId)return;e.preventDefault();
  const id=dragId;dragId=null;z.classList.remove('over');
  soltarEm(id,z);
});
function soltarEm(id,z){
  if(z.dataset.dropday){moverCard(id,z.dataset.dropday)}
  else if(z.dataset.dropst!=null&&typeof soltarKanban==='function')soltarKanban(id,z.dataset.dropst);
  else if(z.dataset.droptst!=null&&typeof soltarTopico==='function')soltarTopico(id,z.dataset.droptst);
}
/* Arrastar e soltar por toque: toque e segure o cartão (~0,35 s) e arraste até o dia ou coluna */
(function(){
  let tm=null,src=null,ghost=null,id=null,sx=0,sy=0,zona=null;
  const ZONAS='[data-dropday],[data-dropst],[data-droptst]';
  document.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    const c=e.target.closest&&e.target.closest('[data-card],[data-tcard]');
    if(!c||e.target.closest('select,button,input,textarea'))return;
    const t=e.touches[0];sx=t.clientX;sy=t.clientY;src=c;
    tm=setTimeout(()=>{tm=null;id=c.dataset.card||('T:'+c.dataset.tcard);ghost=c.cloneNode(true);ghost.classList.add('dragghost');document.body.appendChild(ghost);c.classList.add('dragging');mv(sx,sy);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}},350);
  },{passive:true});
  function mv(x,y){
    ghost.style.left=Math.min(innerWidth-250,Math.max(4,x-120))+'px';ghost.style.top=(y-24)+'px';
    const el=document.elementFromPoint(x,y);const z=el&&el.closest(ZONAS);
    if(z!==zona){zona&&zona.classList.remove('over');zona=z;z&&z.classList.add('over')}
    const b=el&&el.closest('.board');
    if(b){const r=b.getBoundingClientRect();if(x<r.left+36)b.scrollLeft-=14;else if(x>r.right-36)b.scrollLeft+=14}
    if(y<70)window.scrollBy(0,-14);else if(y>innerHeight-100)window.scrollBy(0,14);
  }
  document.addEventListener('touchmove',e=>{
    const t=e.touches[0];
    if(!ghost){if(tm&&(Math.abs(t.clientX-sx)>8||Math.abs(t.clientY-sy)>8)){clearTimeout(tm);tm=null}return}
    e.preventDefault();mv(t.clientX,t.clientY);
  },{passive:false});
  function fim(){
    clearTimeout(tm);tm=null;if(!ghost)return;
    ghost.remove();ghost=null;src&&src.classList.remove('dragging');
    const z=zona,i=id;zona&&zona.classList.remove('over');zona=null;id=null;
    if(z&&i)soltarEm(i,z);
  }
  document.addEventListener('touchend',fim);document.addEventListener('touchcancel',fim);
  document.addEventListener('contextmenu',e=>{if(ghost||(tm&&e.target.closest&&e.target.closest('[data-card],[data-tcard]')))e.preventDefault()});
})();
function moverCard(id,dia){
  const c=cardPorId(id);if(!c||c.data===dia)return;
  const mot=motivoBloqueio(dia,c.m,c.min,c.id,{permitirFinal:c.tipo==='final'});
  if(mot){
    if(mot.startsWith('Carga')){confirmar(mot+'. Mover mesmo assim?',()=>{c.data=dia;c.fixo=true;commit()},'Mover',false);return}
    toast('Não foi possível mover: '+mot,1);return;
  }
  c.data=dia;c.fixo=true;commit();toast('Movido para '+DIAS_L[dow(dia)]+' '+fmtBR(dia));
}

/* ---------- Inicialização ---------- */
function iniciar(){
  const d=carregarDados();
  if(d){state=d;indexar()}
  else{state=estadoInicial();indexar();replanejar(INICIO);salvarDados()}
  setSaveSt('ok');
  aplicarTema();
  if(typeof aoIniciar==='function')aoIniciar();
  render();
}
iniciar();
</script>
