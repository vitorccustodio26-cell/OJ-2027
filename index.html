<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StudyOS · Oficial de Justiça TJSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f6fa;--card:#fff;--ink:#1c2230;--muted:#6a7284;--line:#e5e7ee;--soft:#f0f1f6;
  --accent:#4f46e5;--accent-soft:#eef0ff;--red:#e5484d;--red-soft:#fdecec;--yellow:#e09b13;--yellow-soft:#fdf4e1;
  --green:#2f9e66;--green-soft:#e6f6ee;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);--r:12px;
  --ft:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.45}
h1,h2,h3,h4,.ft,button,.tag,.tab,.subtab,th,.kpi b,.badge{font-family:var(--ft)}
h2{font-size:20px;margin:0 0 4px;font-weight:600}
h3{font-size:16px;margin:0 0 8px;font-weight:600}
h4{font-size:14px;margin:0 0 6px;font-weight:600}
select,input,textarea{font-family:var(--fb);font-size:13px;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:0}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent)}
button{font-size:13px;font-weight:500;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button:hover{background:var(--soft)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{filter:brightness(1.08)}
button.dan{color:var(--red)}
button.sm{padding:3px 8px;font-size:12px}
button.ico{padding:3px 6px;border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1}
button.ico:hover{color:var(--ink);background:var(--soft)}
button:disabled{opacity:.45;cursor:not-allowed}
.muted{color:var(--muted)}.small{font-size:12px}.tiny{font-size:11px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px}
.warn{background:var(--yellow-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:#7a5200}
.err{background:var(--red-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:#9b1c20}
.ok{background:var(--green-soft);border-radius:10px;padding:10px 12px;font-size:13px;color:#1d6b44}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:12px}
.tw{overflow-x:auto}

/* header */
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topin{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--ft);font-weight:700;font-size:20px;letter-spacing:-.3px}
.brand span{color:var(--accent)}
.sub{font-size:12px;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:6px;background:var(--accent-soft);border-radius:10px;padding:6px 12px}
.count b{font-family:var(--ft);font-size:22px;color:var(--accent)}
.savest{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.savest .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.savest.saving .dot{background:var(--yellow)}.savest.error .dot{background:var(--red)}.savest.error{color:var(--red)}
.timerw{display:none;align-items:center;gap:6px;background:#111827;color:#fff;border-radius:10px;padding:5px 8px 5px 12px;font-size:12px}
.timerw.on{display:flex}
.timerw b{font-family:var(--ft);font-size:16px;font-variant-numeric:tabular-nums}
.timerw button{background:#ffffff1a;border:none;color:#fff;padding:3px 8px}
.timerw.brk{background:var(--green)}
.timerw.alert{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(79,70,229,.35)}}

/* calendar */
.calbar{max-width:1400px;margin:0 auto;padding:10px 16px 0}
.cal{display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.calm{flex:0 1 420px;min-width:260px}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.calhead b{font-family:var(--ft);font-size:14px;min-width:130px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .dh{font-size:10px;color:var(--muted);text-align:center;font-family:var(--ft)}
.cd{font-size:11px;text-align:center;border-radius:6px;padding:3px 0;cursor:pointer;background:var(--soft);color:var(--ink);position:relative}
.cd.wk{background:transparent;color:#b3b8c4;cursor:default}
.cd.fol{background:#fde7d6;color:#9a4a12}
.cd.rv{background:#e9e3ff;color:#5b3fd1}
.cd.st{background:#eef0ff}
.cd.prova{background:var(--red);color:#fff;font-weight:700}
.cd.today{outline:2px solid var(--accent);outline-offset:-2px;font-weight:700}
.cd.out{visibility:hidden}
.cd.done::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--green)}
.cd.late::after{content:'';position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--red)}
.calleg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--muted);margin-top:6px}
.calleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.calside{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px;align-content:start;min-width:220px}
.kpi{background:var(--soft);border-radius:10px;padding:8px 12px}
.kpi b{display:block;font-size:18px}
.kpi span{font-size:11px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}

/* tabs */
nav.tabs{max-width:1400px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:none;background:transparent;padding:9px 14px;border-radius:9px;color:var(--muted);font-weight:500;font-size:14px}
.tab.on{background:#fff;color:var(--ink);box-shadow:var(--shadow);font-weight:600}
main{max-width:1400px;margin:0 auto;padding:14px 16px 60px}
.subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:thin}
.subtab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:12px;color:var(--muted);flex:none}
.subtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.subtab.cur{border-color:var(--accent);color:var(--accent)}
.subtab.on.cur{color:#fff}
.subtab.fin{border-style:dashed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.seg button{border:none;border-radius:0;padding:6px 12px}
.seg button.on{background:var(--ink);color:#fff}

/* tags */
.tag{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;line-height:1.5;white-space:nowrap}
.tag.tm{background:color-mix(in srgb,var(--c) 15%,#fff);color:color-mix(in srgb,var(--c) 75%,#000)}
.tag.A{background:#fde8ea;color:#b4232a}.tag.M{background:#fdf1dc;color:#9a6200}.tag.B{background:#e8f1fb;color:#2a5f9e}
.tag.rev{background:#ede7ff;color:#5b3fd1}
.tag.late{background:var(--red);color:#fff}
.tag.fin{background:#e9e3ff;color:#5b3fd1}
.tag.cust{background:var(--soft);color:var(--muted)}
.dotc{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--soft);border-radius:var(--r);padding:8px;min-height:120px;transition:background .15s}
.col.over{background:#e3e6ff}
.col.off{background:repeating-linear-gradient(45deg,#f3f3f6,#f3f3f6 8px,#ececf1 8px,#ececf1 16px)}
.colh{display:flex;justify-content:space-between;align-items:baseline;padding:2px 4px 8px;gap:6px}
.colh b{font-family:var(--ft);font-size:13px}
.colh .small{text-align:right}
.colh.today b{color:var(--accent)}
.card{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:8px 9px;margin-bottom:8px;box-shadow:var(--shadow);cursor:grab}
.card.dragging{opacity:.4}
.card.isdone{opacity:.72}
.card.isdone .ttl{text-decoration:line-through;text-decoration-color:#9aa0ad}
.card.islate{border-color:#f3b3b5;border-left-color:var(--red);background:#fffafa}
.card.isrev{border-left-style:dashed}
.card .tags{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-bottom:5px}
.card .ttl{font-size:12.5px;font-weight:500;margin-bottom:6px;word-break:break-word}
.card .ttl small{color:var(--muted);font-weight:400}
.card .ctl{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.card .ctl select{font-size:11.5px;padding:3px 5px;flex:1;min-width:84px}
.card .meta{display:flex;align-items:center;gap:2px;margin-top:6px}
.card .meta .mins{font-size:11.5px;color:var(--muted);font-family:var(--ft);margin-right:auto}
.card.tact{box-shadow:0 0 0 2px var(--accent)}
.empty{font-size:12px;color:var(--muted);text-align:center;padding:14px 4px}
.kb{grid-template-columns:repeat(5,minmax(0,1fr))}
.kb4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kb4 .col{max-height:640px;overflow-y:auto}

/* blocks */
.blocks{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:12px}
.mini{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.mini:last-child{border-bottom:none}
.mini .t{flex:1;min-width:0}
.mini .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{display:inline-block;min-width:22px;text-align:center;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-family:var(--ft);font-weight:600}
.pill.g{background:var(--accent)}

/* matérias */
.mat{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:10px;overflow:hidden}
.math{display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
.math h3{margin:0;font-size:15px}
.matb{padding:0 14px 12px;display:none}
.mat.open .matb{display:block}
.topic{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.topic .tn{flex:1;min-width:200px;font-size:13px}
.topic select{font-size:12px;padding:3px 6px}
.st{font-size:11px;padding:2px 7px;border-radius:999px;background:var(--soft);color:var(--muted);font-family:var(--ft);font-weight:600}
.st.Iniciado{background:#e6f0ff;color:#2457b5}.st.Revisar{background:var(--yellow-soft);color:#8a5a00}.st.Finalizado{background:var(--green-soft);color:#1d6b44}

/* ciclo */
.cyc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.cycd{background:var(--soft);border-radius:var(--r);padding:10px}
.slot{display:flex;gap:4px;margin-bottom:6px}
.slot select{flex:1}
.slot input{width:62px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(17,24,39,.42);display:flex;align-items:flex-start;justify-content:center;z-index:100;padding:6vh 14px;overflow-y:auto}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.modal.wide{max-width:820px}
.modal h3{font-size:18px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.fm label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.fm label.full{grid-column:1/-1}
.mft{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toasts{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:#111827;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:92vw}
.toast.e{background:var(--red)}

/* questões */
.acc{font-family:var(--ft);font-weight:600;padding:2px 8px;border-radius:999px;font-size:12px;display:inline-block}
.acc.r{background:var(--red-soft);color:#b4232a}.acc.y{background:var(--yellow-soft);color:#8a5a00}.acc.g{background:var(--green-soft);color:#1d6b44}
.focus{background:linear-gradient(90deg,#4f46e5,#7c3aed);color:#fff;border-radius:var(--r);padding:14px 16px;font-family:var(--ft);font-size:16px}
.focus b{font-weight:700}
.rk{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.rk:hover{background:var(--soft)}
.rk .n{width:22px;font-family:var(--ft);color:var(--muted);text-align:center}
.rk .t{flex:1;min-width:0}
.weak{background:var(--red-soft)}
.bnr{max-width:1400px;margin:10px auto 0;padding:0 16px}
.bnr>div{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

@media (max-width:1000px){
  .board,.kb,.kb4,.cyc{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .board,.kb,.kb4,.cyc{grid-template-columns:1fr}
  .fm{grid-template-columns:1fr}
  .calside{min-width:0;grid-template-columns:1fr 1fr}
  .cal.fechado .calgrid,.cal.fechado .calleg,.cal.fechado .calside{display:none}
  .calhead .tgl{display:inline-block!important}
  .topin{gap:8px}
  .brand{font-size:18px}
  main{padding:12px 12px 60px}
}
</style>
</head>
<body>
<header class="top"><div class="topin">
  <div><div class="brand">Study<span>OS</span></div><div class="sub">Oficial de Justiça · TJSP · VUNESP</div></div>
  <div class="count"><b id="hCount">–</b><span class="small">dias para a prova<br><span class="muted">dom., 14/03/2027</span></span></div>
  <div class="sp"></div>
  <div class="timerw" id="timerW"></div>
  <div class="savest" id="saveSt"><span class="dot"></span><span id="saveTx">Carregando…</span></div>
</div></header>
<div class="bnr" id="banners"></div>
<div class="calbar"><div class="panel cal" id="calendar"></div></div>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
<div class="toasts" id="toasts"></div>

<script>

/* ---------- Utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>(p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>JSON.parse(JSON.stringify(o));
function d2s(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function s2d(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}
function addDias(s,n){const d=s2d(s);d.setDate(d.getDate()+n);return d2s(d)}
function dow(s){return s2d(s).getDay()}
function difDias(a,b){return Math.round((s2d(b)-s2d(a))/864e5)}
function segundaDe(s){const w=dow(s);return addDias(s,w===0?-6:1-w)}
function fmtBR(s,ano){const[y,m,d]=s.split('-');return d+'/'+m+(ano?'/'+y:'')}
function hoje(){
  let q=null;try{q=new URLSearchParams(location.search).get('hoje')}catch(e){}
  return (q&&/^\d{4}-\d{2}-\d{2}$/.test(q))?q:d2s(new Date());
}
function fmtHM(min){min=Math.max(0,Math.round(min||0));return pad(Math.floor(min/60))+':'+pad(min%60)+'h'}
function parseHM(t){t=String(t||'').trim().replace(/h$/i,'');const m=t.match(/^(\d{1,3}):([0-5]\d)$/);if(m)return +m[1]*60+ +m[2];if(/^\d+$/.test(t))return +t;return null}
const maxS=(a,b)=>a>b?a:b;

/* ---------- Estado ---------- */
let state=null;
let TOP={};      // topicoId -> {t, m}
let MAT={};      // materiaId -> materia
const ui=Object.assign({calFechado:window.innerWidth<640,tab:'plan',semana:null,vista:'dias',calMes:null,statsMat:'',statsInc:'',qMat:null,qEdit:null,matOpen:{}},(()=>{try{return JSON.parse(localStorage.getItem('studyos-ui')||'{}')}catch(e){return {}}})());
function salvarUI(){try{localStorage.setItem('studyos-ui',JSON.stringify({tab:ui.tab,semana:ui.semana,vista:ui.vista,statsMat:ui.statsMat,statsInc:ui.statsInc}))}catch(e){}}

function estadoInicial(){
  const materias=EDITAL.map(m=>({id:m.id,nome:m.nome,curto:m.curto,cor:m.cor,questoes:m.questoes,pesoTxt:m.pesoTxt,inc:m.inc,pesoPrio:m.pesoPrio||m.questoes,
    topicos:m.topicos.map((t,i)=>({id:m.id+'-'+(i+1),nome:t[0],inc:t[1],tam:t[2]||1}))}));
  return {versao:VERSAO_DADOS,criadoEm:new Date().toISOString(),atualizadoEm:null,
    materias,ciclo:clone(CICLO_PADRAO),folgas:clone(FOLGAS_PADRAO),cards:[],finalizadoEm:{},tempos:[],questoes:[],
    config:{cargaMax:240,maxDisc:3,amostraMin:20,revMin:{1:15,7:15,30:20},pomodoro:false,pomoFoco:25,pomoPausa:5,som:true},
    timer:null,meta:{ultimoBackupExterno:null,ultimaCopiaDiaria:null}};
}
function indexar(){
  TOP={};MAT={};
  for(const m of state.materias){MAT[m.id]=m;for(const t of m.topicos)TOP[t.id]={t,m}}
}

/* ---------- Calendário de estudo ---------- */
function isFolga(s){return state.folgas.some(f=>f.on&&f.data===s)}
function nomeFolga(s){const f=state.folgas.find(f=>f.on&&f.data===s);return f?f.nome:''}
function isDiaEstudo(s){const w=dow(s);return w>=1&&w<=5&&s>=INICIO&&s<=REV_FIM&&!isFolga(s)}
function isSemanaFinal(s){return s>=REV_INI&&s<=REV_FIM}
function semanas(){
  const out=[];let mon=segundaDe(INICIO),n=1;
  while(mon<=REV_FIM){
    const dias=[0,1,2,3,4].map(i=>addDias(mon,i));
    const ini=maxS(dias[0],INICIO);
    out.push({n,mon,dias,ini,fim:dias[4],final:mon===REV_INI,label:'S'+n+' · '+fmtBR(ini)+'–'+fmtBR(dias[4])});
    mon=addDias(mon,7);n++;
  }
  return out;
}
function semanaDe(s){return semanas().find(w=>s>=w.mon&&s<=addDias(w.mon,6))}

/* ---------- Regras do dia ---------- */
function cardsDoDia(s,excluirId){return state.cards.filter(c=>c.data===s&&c.id!==excluirId)}
function infoDia(s,excluirId){
  const cs=cardsDoDia(s,excluirId);const subs=new Set(cs.map(c=>c.m));
  return {cs,subs,carga:cs.reduce((a,c)=>a+(+c.min||0),0)};
}
/* Retorna null se pode, ou o motivo do bloqueio. opts: {ignorarCarga, permitirFinal} */
function motivoBloqueio(s,m,min,excluirId,opts={}){
  if(!s)return 'Data inválida';
  const w=dow(s);
  if(w===0||w===6)return 'Sábado e domingo não têm estudo';
  if(s<INICIO||s>REV_FIM)return 'Fora do período do cronograma';
  if(isFolga(s))return 'Dia de folga ('+nomeFolga(s)+')';
  if(isSemanaFinal(s)&&!opts.permitirFinal)return 'A semana final (08 a 12/03) é reservada à revisão geral';
  const {subs,carga}=infoDia(s,excluirId);
  if(!subs.has(m)&&subs.size>=state.config.maxDisc)return 'O dia já tem '+state.config.maxDisc+' disciplinas';
  if((m===LP&&subs.has(INF))||(m===INF&&subs.has(LP)))return 'Português e Informática nunca podem cair no mesmo dia';
  if(!opts.ignorarCarga&&carga+(+min||0)>state.config.cargaMax)return 'Carga diária passaria de '+fmtHM(state.config.cargaMax);
  return null;
}

/* ---------- Status por tópico ---------- */
function cardsDoTopico(tid,tipo='estudo'){return state.cards.filter(c=>c.t===tid&&c.tipo===tipo).sort((a,b)=>a.data<b.data?-1:a.data>b.data?1:0)}
function statusTopico(tid){
  const cs=cardsDoTopico(tid);
  if(!cs.length)return '';
  if(cs.every(c=>c.status==='Finalizado'))return 'Finalizado';
  if(cs.some(c=>c.status==='Revisar'))return 'Revisar';
  if(cs.some(c=>c.status))return 'Iniciado';
  return '';
}
function parteDe(c){
  if(c.tipo!=='estudo')return '';
  const cs=cardsDoTopico(c.t);if(cs.length<2)return '';
  return 'parte '+(cs.findIndex(x=>x.id===c.id)+1)+'/'+cs.length;
}
function isAtrasado(c){return c.tipo==='estudo'&&c.status!=='Finalizado'&&c.data<hoje()}

/* ---------- Gerador / redistribuidor do planejamento ----------
   Mantém: histórico (antes de "de"), cartões com status, cartões fixados manualmente, revisões.
   Redistribui o restante de cada tópico, na ordem do edital, pelas sessões futuras do ciclo semanal,
   proporcionalmente à incidência (ALTA > MÉDIA > BAIXA) e ao tamanho do tópico. */
function pesoTopico(t){return (INC_PESO[t.inc]||2)*(t.tam||1)}
function replanejar(deParam){
  const de=deParam||maxS(INICIO,hoje());
  const manter=[];
  for(const c of state.cards){
    if(c.tipo==='rev'){manter.push(c);continue}
    if(c.tipo==='final'){if(isFolga(c.data)&&c.status!=='Finalizado')continue;manter.push(c);continue}
    if(!TOP[c.t])continue;                                   // tópico excluído
    if(isFolga(c.data)&&c.status!=='Finalizado')continue;   // nunca deixar atividade em folga
    if(c.data<de){manter.push(c);continue}
    if(c.status||c.fixo)manter.push(c);
  }
  state.cards=manter;
  // semana final de revisão geral
  for(let s=REV_INI;s<=REV_FIM;s=addDias(s,1)){
    if(!isDiaEstudo(s))continue;
    for(const sl of (CICLO_FINAL[dow(s)]||[])){
      if(!MAT[sl.m])continue;
      if(state.cards.some(c=>c.tipo==='final'&&c.data===s&&c.m===sl.m))continue;
      state.cards.push({id:uid('f'),tipo:'final',m:sl.m,t:null,data:s,min:sl.min,status:'',metodo:'',titulo:tituloFinal(sl.m)});
    }
  }
  // sessões por matéria
  const capTot={},sess={};
  for(const m of state.materias){capTot[m.id]=0;sess[m.id]=[]}
  for(let s=INICIO;s<=FIM_CONTEUDO;s=addDias(s,1)){
    if(!isDiaEstudo(s))continue;
    for(const sl of (state.ciclo[dow(s)]||[])){
      if(!MAT[sl.m]||!sl.min)continue;
      capTot[sl.m]+=+sl.min;
      if(s>=de)sess[sl.m].push({data:s,min:+sl.min});
    }
  }
  const novos=[];
  for(const m of state.materias){
    const tops=m.topicos.filter(t=>!t.fora);
    if(!tops.length||!sess[m.id].length)continue;
    const W=tops.reduce((a,t)=>a+pesoTopico(t),0);
    const lista=[];
    for(const t of tops){
      const st=statusTopico(t.id);
      if(st==='Finalizado')continue;
      const mant=cardsDoTopico(t.id).reduce((a,c)=>a+(+c.min||0),0);
      const need=capTot[m.id]*pesoTopico(t)/W;
      let rem=need-mant;
      if(mant>0&&rem<15)continue;      // já coberto pelo que foi mantido
      lista.push({id:t.id,rem:Math.max(rem,15)});
    }
    if(!lista.length)continue;
    const Cf=sess[m.id].reduce((a,x)=>a+x.min,0);
    const R=lista.reduce((a,x)=>a+x.rem,0);
    const f=Cf/R;lista.forEach(x=>x.rem*=f);
    let i=0;const pcs=[];
    for(const se of sess[m.id]){
      let left=se.min;const ini=pcs.length;
      while(left>=10&&i<lista.length){
        const t=lista[i];let take=Math.min(left,t.rem);
        if(t.rem-take<12)take=t.rem;
        pcs.push({t:t.id,data:se.data,min:take});
        t.rem-=take;left-=take;
        if(t.rem<=.5)i++;
      }
      if(left>0&&pcs.length>ini)pcs[pcs.length-1].min+=left;
    }
    while(i<lista.length){ // sobras de arredondamento vão para a última sessão
      const se=sess[m.id][sess[m.id].length-1];pcs.push({t:lista[i].id,data:se.data,min:Math.max(10,lista[i].rem)});i++;
    }
    // junta pedaços do mesmo tópico no mesmo dia e arredonda para 5 min
    const mg=[];
    for(const p of pcs){const l=mg[mg.length-1];if(l&&l.t===p.t&&l.data===p.data)l.min+=p.min;else mg.push({...p})}
    for(const p of mg)novos.push({id:uid('c'),tipo:'estudo',m:m.id,t:p.t,data:p.data,min:Math.max(10,Math.round(p.min/5)*5),status:'',metodo:''});
  }
  state.cards.push(...novos);
  // nunca ultrapassar a carga diária por arredondamento
  const dias=[...new Set(novos.map(c=>c.data))];
  for(const d of dias){
    let exc=infoDia(d).carga-state.config.cargaMax;
    while(exc>0){
      const alvo=novos.filter(c=>c.data===d&&c.min>10).sort((a,b)=>b.min-a.min)[0];if(!alvo)break;
      const r=Math.min(exc,alvo.min-10);alvo.min-=r;exc-=r;
    }
  }
  if(typeof reposicionarRevisoes==='function')reposicionarRevisoes(de);
}

const LS_KEY='studyos-dados';
function carregarDados(){
  try{const raw=localStorage.getItem(LS_KEY);if(!raw)return null;return migrar(JSON.parse(raw))}catch(e){console.error(e);return null}
}
function migrar(d){
  if(!d||typeof d!=='object')throw new Error('Arquivo inválido');
  if(d.versao==null)throw new Error('Campo "versao" ausente');
  if(d.versao>VERSAO_DADOS)throw new Error('Versão de dados mais nova que este StudyOS');
  // futuras migrações: if(d.versao===1){...; d.versao=2}
  const base=estadoInicial();
  for(const k of Object.keys(base))if(d[k]===undefined)d[k]=base[k];
  d.config=Object.assign(base.config,d.config||{});
  d.meta=Object.assign(base.meta,d.meta||{});
  return d;
}

function validarCiclo(c){
  const erros=[],avisos=[];const sem=new Set();
  for(const d of [1,2,3,4,5]){
    const sl=(c[d]||[]).filter(x=>x.m);const set=new Set(sl.map(x=>x.m));
    set.forEach(m=>sem.add(m));
    if(set.size>state.config.maxDisc)erros.push(DIAS_L[d]+': mais de '+state.config.maxDisc+' disciplinas.');
    if(set.has(LP)&&set.has(INF))erros.push(DIAS_L[d]+': Língua Portuguesa e Informática não podem ficar no mesmo dia.');
    if(set.size<sl.length)avisos.push(DIAS_L[d]+': matéria repetida no mesmo dia (os blocos serão somados).');
    const tot=sl.reduce((a,x)=>a+(+x.min||0),0);
    if(tot>state.config.cargaMax)erros.push(DIAS_L[d]+': carga de '+fmtHM(tot)+' acima do máximo de '+fmtHM(state.config.cargaMax)+'.');
    else if(tot&&tot<180)avisos.push(DIAS_L[d]+': carga de '+fmtHM(tot)+' abaixo de 3h.');
  }
  const falt=state.materias.filter(m=>!sem.has(m.id)&&m.topicos.some(t=>!t.fora));

/* =================== ETAPA 3: revisões, atrasos, cronômetro, questões =================== */

/* ---------- Revisão espaçada automática (D+1, D+7, D+30) ---------- */
function aoMudarStatusTopico(tid,ant,nov){
  if(ant!=='Finalizado'&&nov==='Finalizado')agendarRevisoes(tid);
  else if(ant==='Finalizado'&&nov!=='Finalizado')removerRevisoes(tid);
}
function acharDiaRevisao(c,de){
  let d=maxS(maxS(c.alvo,INICIO),de||INICIO);
  while(d<=FIM_CONTEUDO){if(!motivoBloqueio(d,c.m,c.min,c.id))return d;d=addDias(d,1)}
  return null; // cairia na semana final ou depois de 12/03: descartada
}
function agendarRevisoes(tid){
  const base=hoje();state.finalizadoEm[tid]=base;const m=TOP[tid].m;
  removerRevisoes(tid,true);
  let ok=[],desc=0;
  for(const n of [1,7,30]){
    const c={id:uid('r'),tipo:'rev',m:m.id,t:tid,n,alvo:addDias(base,n),min:+state.config.revMin[n]||15,status:'Pendente',metodo:''};
    const d=acharDiaRevisao(c);
    if(d){c.data=d;state.cards.push(c);ok.push('D+'+n+' '+fmtBR(d))}else desc++;
  }
  toast('Revisões agendadas: '+(ok.join(', ')||'nenhuma')+(desc?' · '+desc+' descartada(s) (cairiam na semana final ou após 12/03)':''));
}
function removerRevisoes(tid,silencioso){
  const n=state.cards.filter(c=>c.tipo==='rev'&&c.t===tid).length;
  state.cards=state.cards.filter(c=>!(c.tipo==='rev'&&c.t===tid));
  if(!silencioso){delete state.finalizadoEm[tid];if(n)toast(n+' revisão(ões) agendada(s) removida(s)')}
}
function reposicionarRevisoes(de){
  const pend=state.cards.filter(c=>c.tipo==='rev'&&c.status!=='Revisada'&&(c.data>=de||isFolga(c.data)));
  state.cards=state.cards.filter(c=>!pend.includes(c));
  pend.sort((a,b)=>a.alvo<b.alvo?-1:1);
  for(const c of pend){const d=acharDiaRevisao(c,isFolga(c.data)?c.data:de);if(d){c.data=d;state.cards.push(c)}}
}

/* ---------- Blocos do topo: revisões de hoje e pendências ---------- */
const ORD_INC={A:0,M:1,B:2};
function incDe(c){return c.t&&TOP[c.t]?TOP[c.t].t.inc:'M'}
function htmlBlocosTopo(){
  const h=hoje();

/* Simula a redistribuição dos atrasados: alta incidência primeiro; próximos dias úteis; respeita 3 disciplinas,
   carga diária e Português x Informática; pode dividir em blocos de 15 min ou mais; nunca entra na semana final. */
function simularAtrasados(){
  const orig=state.cards;state.cards=clone(orig);
  const late=state.cards.filter(isAtrasado).sort((a,b)=>ORD_INC[incDe(a)]-ORD_INC[incDe(b)]||(a.data<b.data?-1:1));
  const ini=maxS(hoje(),INICIO),res=[],semEnc=[];
  for(const L of late){
    const antes=L.data,minOrig=L.min;let rest=L.min;const pcs=[],criados=[];
    L.data='__x';                                     // tira do dia original durante a busca
    for(let d=ini;d<=FIM_CONTEUDO&&rest>0;d=addDias(d,1)){
      const pc=Math.min(rest,15);
      if(motivoBloqueio(d,L.m,pc,L.id))continue;
      const room=state.config.cargaMax-infoDia(d,L.id).carga;
      let take=Math.min(rest,room);
      if(take<rest&&rest-take<15)take=rest-15;          // evita sobrar pedaço menor que 15 min
      if(take<Math.min(15,rest))continue;
      const nc=pcs.length?{...L,id:uid('c'),data:d,min:take,fixo:true}:Object.assign(L,{data:d,min:take,fixo:true});
      if(pcs.length){state.cards.push(nc);criados.push(nc.id)}
      pcs.push({data:d,min:take});rest-=take;
    }
    if(rest>0){ // não coube inteiro: desfaz
      state.cards=state.cards.filter(c=>!criados.includes(c.id));
      L.data=antes;L.min=minOrig;semEnc.push(L);
    }else res.push({c:L,de:antes,pcs});
  }
  const sim=state.cards;state.cards=orig;
  return {sim,res,semEnc};
}
ACOES.replanAtr=()=>{
  const {sim,res,semEnc}=simularAtrasados();
  const ov=modal('<h3>Prévia: replanejar atrasados</h3><p class="small muted">Ordem por incidência (ALTA primeiro). Respeita '+state.config.maxDisc+' disciplinas por dia, carga de '+fmtHM(state.config.cargaMax)+' e a regra Português × Informática. A semana final de revisão não é usada.</p>'+

}
function tickTimer(){
  const t=state&&state.timer;if(!t)return;

    if(t.fase==='foco'&&t.inicio&&tDecorrido()-t.focoBase>=state.config.pomoFoco*60000){
      t.acum+=Date.now()-t.inicio;t.inicio=null;t.fase='pausa';t.pausaAte=Date.now()+state.config.pomoPausa*60000;
      bip();toast('🍅 Foco concluído! Pausa de '+state.config.pomoPausa+' min.');commit();return;

  }
  const v=fmtRel(tDecorrido());$$('[data-tdisp]').forEach(e=>e.textContent=v);

}

/* ---------- Questões: registro e diagnóstico ---------- */
function optsTopicos(mid,sel){if(!mid||!MAT[mid])return '<option value="">—</option>';return '<option value="">Todos / não informado</option>'+MAT[mid].topicos.map(t=>'<option value="'+t.id+'"'+(t.id===sel?' selected':'')+'>'+esc(t.nome.length>90?t.nome.slice(0,88)+'…':t.nome)+'</option>').join('')}
const accCls=p=>p<70?'r':p<=80?'y':'g';
const accTag=(ok,n)=>n?'<span class="acc '+accCls(100*ok/n)+'">'+Math.round(100*ok/n)+'%</span>':'<span class="muted">—</span>';
function statsQ(filtro){let n=0,ok=0;for(const q of state.questoes)if(filtro(q)){n+=q.total;ok+=q.ok}return {n,ok,p:n?100*ok/n:null}}
function prioridades(){
  const h=hoje(),maxP=Math.max(...state.materias.map(m=>m.pesoPrio||m.questoes||1));
  return state.materias.map(m=>{
    let N=0,E=0,n=0,ok=0;
    for(const q of state.questoes)if(q.m===m.id){const w=difDias(q.data,h)<=30?2:1;N+=w*q.total;E+=w*q.err;n+=q.total;ok+=q.ok}
    const err=(E+.3*10)/(N+10);                         // suavizado: sem dados assume 30% de erro
    const pn=(m.pesoPrio||m.questoes||1)/maxP,inf=INC_FATOR[m.inc]||.66;
    const idx=Math.round(100*(.5*err+.3*pn+.2*inf));
    const partes=[pn>=.55?'Peso alto no edital':pn>=.3?'Peso médio no edital':'Peso baixo no edital'];
    if(m.inc==='A')partes.push('incidência ALTA');else if(m.inc==='B')partes.push('incidência BAIXA');
    partes.push(n?Math.round(100*ok/n)+'% de acertos'+(n<state.config.amostraMin?' (amostra pequena)':''):'sem questões registradas');
    return {m,idx,just:partes.join(' + '),n};
  }).sort((a,b)=>b.idx-a.idx);
}

  return o;
};
function htmlDetalheQ(mid){
  const m=MAT[mid];
  const tops=m.topicos.map(t=>({t,...statsQ(q=>q.m===mid&&q.t===t.id)})).filter(x=>x.n>0);
  const fracos=tops.slice().sort((a,b)=>a.p-b.p).slice(0,3).map(x=>x.t.id);
  // evolução semanal
  const sem={};for(const q of state.questoes)if(q.m===mid){const k=segundaDe(q.data);sem[k]=sem[k]||{n:0,ok:0};sem[k].n+=q.total;sem[k].ok+=q.ok}
  const ks=Object.keys(sem).sort();
  let svg='<div class="empty">Sem dados para o gráfico.</div>';
  if(ks.length){
    const W=600,H=180,px=34,py=14,x=i=>ks.length===1?W/2:px+i*(W-2*px)/(ks.length-1),y=p=>py+(100-p)*(H-2*py-14)/100;
    const pts=ks.map((k,i)=>[x(i),y(100*sem[k].ok/sem[k].n),Math.round(100*sem[k].ok/sem[k].n),k]);
    svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;max-height:220px">'+
      [0,70,80,100].map(v=>'<line x1="'+px+'" x2="'+(W-px)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="'+(v===70?'#f3b3b5':v===80?'#b6e3cb':'#e5e7ee')+'" stroke-dasharray="'+(v===70||v===80?'4 4':'0')+'"/><text x="4" y="'+(y(v)+4)+'" font-size="10" fill="#6a7284">'+v+'%</text>').join('')+
      '<polyline fill="none" stroke="'+m.cor+'" stroke-width="2.5" points="'+pts.map(p=>p[0]+','+p[1]).join(' ')+'"/>'+
      pts.map(p=>'<circle cx="'+p[0]+'" cy="'+p[1]+'" r="4" fill="'+m.cor+'"><title>Semana de '+fmtBR(p[3])+': '+p[2]+'%</title></circle><text x="'+p[0]+'" y="'+(p[1]-8)+'" font-size="10" text-anchor="middle" fill="#1c2230">'+p[2]+'%</text><text x="'+p[0]+'" y="'+(H-2)+'" font-size="10" text-anchor="middle" fill="#6a7284">'+fmtBR(p[3])+'</text>').join('')+'</svg>';
  }
  return '<div class="panel" style="margin-top:14px;border-top:3px solid '+m.cor+'"><div class="row"><h3 style="margin:0">'+esc(m.nome)+': desempenho por assunto</h3><span class="sp"></span><button class="sm" data-act="qDet" data-id="">Fechar</button></div>'+
   '<div class="grid g2" style="margin-top:10px"><div>'+(tops.length?'<div class="tw"><table><tr><th>Assunto</th><th>Questões</th><th>%</th></tr>'+tops.sort((a,b)=>a.p-b.p).map(x=>'<tr class="'+(fracos.includes(x.t.id)?'weak':'')+'"><td class="small">'+(fracos.includes(x.t.id)?'⚠ ':'')+esc(x.t.nome)+'</td><td>'+x.n+'</td><td>'+accTag(x.ok,x.n)+'</td></tr>').join('')+'</table></div><div class="tiny muted" style="margin-top:4px">⚠ = 3 assuntos mais fracos</div>':'<div class="empty">Registre questões com o assunto preenchido para ver o desempenho por assunto.</div>')+'</div>'+
   '<div><h4>Evolução semanal do % de acertos</h4>'+svg+'</div></div></div>';
}
document.addEventListener('input',e=>{
  const t=e.target;if(!t.matches('[data-qf]'))return;
  t.dataset.auto='';
  const f={tot:$('#qTot'),ok:$('#qOk'),err:$('#qErr')};
  const v=k=>f[k].value===''?null:+f[k].value;
  const auto=Object.keys(f).find(k=>f[k].dataset.auto==='1');
  const vazios=Object.keys(f).filter(k=>v(k)===null);
  const alvo=auto||(vazios.length===1?vazios[0]:null);
  if(alvo&&f[alvo]!==t){
    const o=Object.keys(f).filter(k=>k!==alvo);
    if(o.every(k=>v(k)!==null)){
      const r=alvo==='tot'?v('ok')+v('err'):alvo==='ok'?v('tot')-v('err'):v('tot')-v('ok');
      f[alvo].value=r;f[alvo].dataset.auto='1';
    }
  }
  const T=v('tot'),O=v('ok');$('#qPrev').innerHTML=T&&O!=null&&O<=T?accTag(O,T):'';
});
ACOES.qSalvar=()=>{
  const data=$('#qData').value,m=$('#qMat').value,t=$('#qTop').value||null;
  const tot=$('#qTot').value===''?null:+$('#qTot').value,ok=$('#qOk').value===''?null:+$('#qOk').value,er=$('#qErr').value===''?null:+$('#qErr').value;
  const msg=[];
  if(!data)msg.push('Informe a data.');if(!m)msg.push('Escolha a matéria.');
  if(tot==null||ok==null||er==null)msg.push('Preencha ao menos dois dos campos total, acertos e erros.');
  else{
    if([tot,ok,er].some(x=>x<0||!Number.isInteger(x)))msg.push('Use números inteiros não negativos.');
    if(tot===0)msg.push('O total precisa ser maior que zero.');
    if(ok+er!==tot)msg.push('Acertos + erros ('+(ok+er)+') ≠ total ('+tot+'). Cadastro bloqueado.');
  }
  if(msg.length){$('#qMsg').innerHTML='<div class="err" style="margin-bottom:8px">'+msg.join(' ')+'</div>';return}
  if(ui.qEdit){Object.assign(state.questoes.find(q=>q.id===ui.qEdit),{data,m,t,total:tot,ok,err:er});ui.qEdit=null;toast('Registro atualizado')}
  else{state.questoes.push({id:uid('q'),data,m,t,total:tot,ok,err:er,criado:Date.now()});toast('Questões cadastradas: '+Math.round(100*ok/tot)+'% de acertos')}
  commit();
};
ACOES.qCancel=()=>{ui.qEdit=null;render()};
ACOES.qEditar=id=>{ui.qEdit=id;render();window.scrollTo(0,$('#main').offsetTop-80)};
ACOES.qDel=id=>confirmar('Excluir este registro de questões?',()=>{state.questoes=state.questoes.filter(q=>q.id!==id);commit()},'Excluir');
ACOES.qDet=id=>{ui.qMat=id||null;render()};

/* ---------- Ações (delegação de eventos) ---------- */
function cardPorId(id){return state.cards.find(c=>c.id===id)}
function definirStatus(c,st){
  if(c.tipo==='rev'){c.status=st;return}
  const ant=c.t?statusTopico(c.t):'';
  c.status=st;
  if(c.tipo==='estudo'&&c.t){
    const nov=statusTopico(c.t);
    if(typeof aoMudarStatusTopico==='function')aoMudarStatusTopico(c.t,ant,nov);
  }
}
ACOES.edit=id=>{
  const c=cardPorId(id);if(!c)return;const tp=c.t&&TOP[c.t]?TOP[c.t].t:null;
  const ov=modal('<h3>Editar bloco</h3><div>'+tagMat(c.m)+' '+(tp?tagInc(tp.inc):'')+'</div><div class="fm">'+
    '<label class="full">Título exibido<input id="eTit" value="'+esc(c.titulo||(tp?tp.nome:''))+'"></label>'+
    '<label>Data<input type="date" id="eData" value="'+c.data+'" min="'+INICIO+'" max="'+REV_FIM+'"></label>'+
    '<label>Duração (h:mm)<input id="eMin" value="'+fmtHM(c.min).replace('h','')+'"></label>'+
    '<label>Como concluir<select id="eMet"><option value="">—</option>'+METODOS.map(s=>'<option'+(c.metodo===s?' selected':'')+'>'+s+'</option>').join('')+'</select></label>'+
    (tp?'<label>Incidência do tópico<select id="eInc">'+optsInc(tp.inc)+'</select></label>':'<span></span>')+
    '<label class="full">Anotação<input id="eNota" value="'+esc(c.nota||'')+'"></label></div>'+
    '<div id="eErr"></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Salvar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{
    const data=$('#eData').value,min=parseHM($('#eMin').value);
    if(min==null||min<5){$('#eErr').innerHTML='<div class="err">Duração inválida. Use o formato 01:30.</div>';return}
    if(data!==c.data||min!==c.min){
      const mot=motivoBloqueio(data,c.m,min,c.id,{permitirFinal:c.tipo==='final'||(c.data>=REV_INI)});
      if(mot&&!(mot.startsWith('Carga')&&data===c.data)){
        if(mot.startsWith('Carga')){if(!confirm(mot+'. Salvar mesmo assim?'))return}
        else{$('#eErr').innerHTML='<div class="err">'+mot+'.</div>';return}
      }
    }
    const tit=$('#eTit').value.trim();
    c.titulo=(tp&&tit===tp.nome)||!tit?undefined:tit;
    if(data!==c.data)c.fixo=true;
    c.data=data;c.min=min;c.metodo=$('#eMet').value;c.nota=$('#eNota').value.trim()||undefined;
    if(tp&&$('#eInc'))tp.inc=$('#eInc').value;
    if(c.tipo==='estudo')c.fixo=true;
    fecharModal();commit();
  };
};
ACOES.del=id=>{
  const c=cardPorId(id);if(!c)return;
  confirmar('Excluir este bloco do planejamento?<br><span class="small muted">'+esc(c.titulo||(c.t&&TOP[c.t]?TOP[c.t].t.nome:''))+'</span>',()=>{
    const ant=c.t?statusTopico(c.t):'';
    state.cards=state.cards.filter(x=>x.id!==id);
    if(c.tipo==='estudo'&&c.t&&typeof aoMudarStatusTopico==='function')aoMudarStatusTopico(c.t,ant,statusTopico(c.t));
    commit();toast('Bloco excluído');
  },'Excluir');
};
ACOES.calTgl=()=>{ui.calFechado=!ui.calFechado;renderCalendario()};
ACOES.cicloPadrao=()=>{state.ciclo=clone(CICLO_PADRAO);commit()};
ACOES.cicloAplicar=()=>{
  const v=validarCiclo(state.ciclo);if(v.erros.length){toast('Corrija os erros do ciclo antes de aplicar',1);return}
  confirmar('Redistribuir o planejamento futuro com este ciclo? O que já tem status, foi movido manualmente ou está no passado é mantido.',()=>{replanejar();commit();toast('Planejamento redistribuído')},'Redistribuir',false);
};
ACOES.replanTudo=()=>confirmar('Redistribuir o planejamento futuro (a partir de hoje)?',()=>{replanejar();commit();toast('Planejamento redistribuído')},'Redistribuir',false);
ACOES.topEdit=id=>{
  const {t}=TOP[id];
  const ov=modal('<h3>Editar tópico</h3><div class="fm"><label class="full">Nome<input id="tNome" value="'+esc(t.nome)+'"></label></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Salvar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{const v=$('#tNome').value.trim();if(v)t.nome=v;fecharModal();commit()};
};
ACOES.topDel=id=>{
  const {t,m}=TOP[id];
  confirmar('Excluir o tópico “'+esc(t.nome)+'” e todos os seus blocos e revisões?',()=>{
    m.topicos=m.topicos.filter(x=>x.id!==id);state.cards=state.cards.filter(c=>c.t!==id);delete state.finalizadoEm[id];commit();toast('Tópico excluído');
  },'Excluir');
};
ACOES.topAdd=mid=>{
  const m=MAT[mid];
  const ov=modal('<h3>Novo tópico · '+esc(m.nome)+'</h3><div class="fm"><label class="full">Nome do tópico<input id="nNome" placeholder="Ex.: Súmulas do STJ sobre citação"></label>'+
   '<label>Incidência estimada<select id="nInc">'+optsInc('M')+'</select></label>'+
   '<label>Como inserir<select id="nModo"><option value="redist">Redistribuir no planejamento futuro</option><option value="data">Agendar em uma data</option><option value="nao">Só cadastrar (sem agendar)</option></select></label>'+
   '<label>Data (se agendar)<input type="date" id="nData" min="'+INICIO+'" max="'+FIM_CONTEUDO+'"></label>'+
   '<label>Duração (h:mm)<input id="nMin" value="00:40"></label></div><div id="nErr"></div><div class="mft"><button data-x>Cancelar</button><button class="pri" data-ok>Adicionar</button></div>');
  $('[data-x]',ov).onclick=fecharModal;
  $('[data-ok]',ov).onclick=()=>{
    const nome=$('#nNome').value.trim();if(!nome){$('#nErr').innerHTML='<div class="err">Informe o nome.</div>';return}
    const modo=$('#nModo').value,t={id:mid+'-n'+Date.now().toString(36),nome,inc:$('#nInc').value,tam:1,custom:true};
    if(modo==='data'){
      const d=$('#nData').value,min=parseHM($('#nMin').value);
      if(min==null||min<5){$('#nErr').innerHTML='<div class="err">Duração inválida.</div>';return}
      const mot=motivoBloqueio(d,mid,min,null);
      if(mot&&!mot.startsWith('Carga')){$('#nErr').innerHTML='<div class="err">'+mot+'.</div>';return}
      if(mot&&!confirm(mot+'. Agendar mesmo assim?'))return;
      t.fora=true;m.topicos.push(t);indexar();
      state.cards.push({id:uid('c'),tipo:'estudo',m:mid,t:t.id,data:d,min,status:'',metodo:'',fixo:true});
    }else if(modo==='nao'){t.fora=true;m.topicos.push(t);indexar()}
    else{m.topicos.push(t);indexar();replanejar()}
    fecharModal();ui.matOpen[mid]=true;commit();toast('Tópico adicionado');
  };
};
ACOES.folgaAdd=()=>{
  const d=$('#fData').value;if(!d){toast('Escolha a data',1);return}
  const w=dow(d);if(w===0||w===6){toast('Fins de semana já não têm estudo',1);return}
  if(state.folgas.some(f=>f.data===d)){toast('Essa data já está na lista',1);return}
  state.folgas.push({data:d,nome:$('#fNome').value.trim()||'Folga',on:true});replanejar();commit();toast('Folga adicionada e planejamento redistribuído');
};
ACOES.folgaDel=d=>confirmar('Remover a folga de '+fmtBR(d,1)+' da lista?',()=>{state.folgas=state.folgas.filter(f=>f.data!==d);replanejar();commit()},'Remover');
ACOES.cfSalvar=()=>{
  const c=parseHM($('#cfCarga').value);if(c==null||c<60||c>600){toast('Carga máxima inválida',1);return}
  state.config.cargaMax=c;state.config.amostraMin=Math.max(1,+$('#cfAmostra').value||20);
  state.config.revMin={1:+$('#cfR1').value||15,7:+$('#cfR7').value||15,30:+$('#cfR30').value||20};
  commit();toast('Preferências salvas');
};

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-sem],[data-vista],[data-act],[data-calnav],[data-calday],[data-matopen]');
  if(!t)return;
  if(e.target.closest('[data-stop]'))return;
  if(t.dataset.tab){ui.tab=t.dataset.tab;if(t.dataset.sem!=null)ui.semana=+t.dataset.sem;render();window.scrollTo(0,0);return}
  if(t.dataset.sem!=null){ui.semana=+t.dataset.sem;render();return}
  if(t.dataset.vista){ui.vista=t.dataset.vista;render();return}
  if(t.dataset.calnav!=null){
    const v=+t.dataset.calnav;
    if(v===0)ui.calMes=null;else{const[y,m]=ui.calMes.split('-').map(Number);const d=new Date(y,m-1+v,1);ui.calMes=d.getFullYear()+'-'+pad(d.getMonth()+1)}
    renderCalendario();return}
  if(t.dataset.calday){const w=semanaDe(t.dataset.calday);if(w){ui.tab='plan';ui.semana=w.n-1;render();window.scrollTo(0,0)}return}
  if(t.dataset.matopen){ui.matOpen[t.dataset.matopen]=!ui.matOpen[t.dataset.matopen];render();return}
  const a=t.dataset.act;if(a&&ACOES[a]){e.preventDefault();ACOES[a](t.dataset.id,t)}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.act==='status'){const c=cardPorId(t.dataset.id);if(c){definirStatus(c,t.value);commit()}return}
  if(t.dataset.act==='metodo'){const c=cardPorId(t.dataset.id);if(c){c.metodo=t.value;commit()}return}
  if(t.dataset.matinc){MAT[t.dataset.matinc].inc=t.value;commit();return}
  if(t.dataset.topinc){TOP[t.dataset.topinc].t.inc=t.value;commit();toast('Incidência atualizada (use “Redistribuir” para refletir no tempo dos blocos futuros)');return}
  if(t.dataset.folga){const f=state.folgas.find(x=>x.data===t.dataset.folga);f.on=t.checked;replanejar();commit();toast(f.on?'Folga ativada · planejamento redistribuído':'Folga desativada · planejamento redistribuído');return}
  if(t.dataset.cic){
    const d=t.dataset.cic,i=+t.dataset.i;const sl=state.ciclo[d]=state.ciclo[d]||[];
    while(sl.length<=i)sl.push({m:'',min:0});
    if(t.dataset.f==='m')sl[i].m=t.value;else sl[i].min=+t.value||0;
    state.ciclo[d]=sl.filter((x,j)=>x.m||j<sl.length);
    state.ciclo[d]=state.ciclo[d].filter(x=>x.m||x.min);
    commit();return}
  if(typeof aoChange==='function')aoChange(e);
});

/* ---------- Arrastar e soltar ---------- */
let dragId=null;
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card],[data-tcard]');if(!c)return;dragId=c.dataset.card||('T:'+c.dataset.tcard);c.classList.add('dragging');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
document.addEventListener('dragend',e=>{$$('.dragging').forEach(x=>x.classList.remove('dragging'));$$('.over').forEach(x=>x.classList.remove('over'));dragId=null});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('[data-dropday],[data-dropst],[data-droptst]');if(!z||!dragId)return;e.preventDefault();$$('.over').forEach(x=>x!==z&&x.classList.remove('over'));z.classList.add('over')});
document.addEventListener('drop',e=>{
  const z=e.target.closest&&e.target.closest('[data-dropday],[data-dropst],[data-droptst]');if(!z||!dragId)return;e.preventDefault();
  const id=dragId;dragId=null;z.classList.remove('over');
  if(z.dataset.dropday){moverCard(id,z.dataset.dropday)}
  else if(z.dataset.dropst!=null&&typeof soltarKanban==='function')soltarKanban(id,z.dataset.dropst);
  else if(z.dataset.droptst!=null&&typeof soltarTopico==='function')soltarTopico(id,z.dataset.droptst);
});
function moverCard(id,dia){
  const c=cardPorId(id);if(!c||c.data===dia)return;
  const mot=motivoBloqueio(dia,c.m,c.min,c.id,{permitirFinal:c.tipo==='final'});
  if(mot){
    if(mot.startsWith('Carga')){confirmar(mot+'. Mover mesmo assim?',()=>{c.data=dia;c.fixo=true;commit()},'Mover',false);return}
    toast('Não foi possível mover: '+mot,1);return;
  }
  c.data=dia;c.fixo=true;commit();toast('Movido para '+DIAS_L[dow(dia)]+' '+fmtBR(dia));
}

/* ---------- Inicialização ---------- */
function iniciar(){
  const d=carregarDados();
  if(d){state=d;indexar()}
  else{state=estadoInicial();indexar();replanejar(INICIO);salvarDados()}
  setSaveSt('ok');
  if(typeof aoIniciar==='function')aoIniciar();
  render();
}
iniciar();
</script>
